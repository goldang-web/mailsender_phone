# docker-compose.yml: Docker 컨테이너 여러 개를 묶어서 실행·관리하는 설정 파일입니다.
# 여기서는 FastAPI 서버 하나만 다루지만, 학습 목적에 맞춰 각 항목을 주석으로 설명합니다.

version: "3.9"  # Compose 파일 포맷 버전. 최신 기능을 사용하기 위해 3.9를 선택했습니다.

services:
  server:
    # build: 컨테이너 이미지를 어떻게 만들지 정의합니다.
    # context: 현재 server 디렉터리를 빌드에 사용, dockerfile: 사용할 Dockerfile 경로.
    build:
      context: .
      dockerfile: Dockerfile

    # container_name: docker ps에서 보기 쉬운 별칭을 부여합니다.
    container_name: mailsender-server

    # ports: "호스트포트:컨테이너포트"로 매핑해 외부 접속을 허용합니다.
    #       여기서는 호스트 8000 → 컨테이너 8000으로 노출합니다.
    ports:
      - "8000:8000"

    # volumes: 호스트와 컨테이너 사이에 파일/디렉터리를 공유합니다.
    # - SQLite DB(control.db, email_logs.db)와 storage 디렉터리를 매핑해 데이터를 영구화합니다.
    # - templates와 domains를 매핑하면 HTML·도메인 파일 수정을 즉시 반영할 수 있습니다.
    volumes:
      - ./control.db:/app/control.db
      - ./email_logs.db:/app/email_logs.db
      - ./storage:/app/storage
      - ./templates:/app/templates
      - ./domains:/app/domains

    # environment: 필요 시 FastAPI가 읽을 환경 변수를 설정합니다.
    #              지금은 필수 변수가 없어 빈 목록으로 두고, 학습 시 자유롭게 추가할 수 있습니다.
    environment: []

    # restart: 컨테이너가 예기치 않게 종료되면 자동으로 재시작하도록 설정합니다.
    restart: unless-stopped
