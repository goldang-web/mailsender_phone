<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>메일 발송 제어 대시보드</title>
<style>
:root {
  --card-columns: 4;
  --card-gap: 12px;
  --card-min-width: 220px;

  color-scheme: light;
  --color-bg: #f1f5f9;
  --color-text: #0f172a;
  --color-heading: #1f2937;
  --color-subtext: #6b7280;
  --color-muted: #475569;
  --color-muted-soft: #64748b;
  --color-muted-strong: #1e293b;
  --color-placeholder: #94a3b8;
  --color-surface: #ffffff;
  --color-surface-subtle: #f8fafc;
  --color-surface-alt: #f9fafb;
  --color-border: #e2e8f0;
  --color-border-strong: #cbd5f5;
  --color-chip-neutral-bg: #f1f5f9;
  --color-chip-neutral-text: #475569;
  --color-chip-neutral-border: #e2e8f0;
  --color-accent: #2563eb;
  --color-accent-strong: #1d4ed8;
  --color-accent-soft: #dbeafe;
  --color-accent-text-contrast: #ffffff;
  --color-success: #047857;
  --color-success-bg: #dcfce7;
  --color-success-soft: #ecfdf5;
  --color-success-border: #bbf7d0;
  --color-danger: #b91c1c;
  --color-danger-bg: #fee2e2;
  --color-danger-border: #fca5a5;
  --color-danger-soft: #fef2f2;
  --color-danger-soft-border: #fecdd3;
  --color-danger-strong: #ef4444;
  --color-danger-intense: #dc2626;
  --color-warning: #d97706;
  --color-warning-strong: #b45309;
  --color-info: #0369a1;
  --color-modal-backdrop: rgba(15, 23, 42, 0.48);
  --color-ghost-border: #94a3b8;
  --color-ip-highlight: #2563eb;
  --shadow-elevated: rgba(15, 23, 42, 0.08);
  --shadow-success: rgba(4, 120, 87, 0.12);
  --shadow-hover: rgba(37, 99, 235, 0.2);
  --shadow-modal: rgba(15, 23, 42, 0.25);
}

:root[data-theme="light"] {
  color-scheme: light;
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --color-bg: #0b1120;
  --color-text: #e2e8f0;
  --color-heading: #f8fafc;
  --color-subtext: #94a3b8;
  --color-muted: #94a3b8;
  --color-muted-soft: #a5b4cf;
  --color-muted-strong: #cbd5f5;
  --color-placeholder: #94a3b8;
  --color-surface: #111c2f;
  --color-surface-subtle: #16243c;
  --color-surface-alt: #1b2a44;
  --color-border: rgba(148, 163, 184, 0.25);
  --color-border-strong: rgba(148, 163, 184, 0.4);
  --color-chip-neutral-bg: rgba(148, 163, 184, 0.14);
  --color-chip-neutral-text: #e2e8f0;
  --color-chip-neutral-border: rgba(148, 163, 184, 0.35);
  --color-accent: #60a5fa;
  --color-accent-strong: #93c5fd;
  --color-accent-soft: rgba(96, 165, 250, 0.18);
  --color-accent-text-contrast: #041019;
  --color-success: #34d399;
  --color-success-bg: rgba(34, 197, 94, 0.22);
  --color-success-soft: rgba(22, 101, 52, 0.4);
  --color-success-border: rgba(34, 197, 94, 0.45);
  --color-danger: #f87171;
  --color-danger-bg: rgba(248, 113, 113, 0.24);
  --color-danger-border: rgba(248, 113, 113, 0.45);
  --color-danger-soft: rgba(127, 29, 29, 0.35);
  --color-danger-soft-border: rgba(248, 113, 113, 0.38);
  --color-danger-strong: #f87171;
  --color-danger-intense: #f87171;
  --color-warning: #fbbf24;
  --color-warning-strong: #f59e0b;
  --color-info: #38bdf8;
  --color-modal-backdrop: rgba(2, 6, 23, 0.7);
  --color-ghost-border: rgba(148, 163, 184, 0.45);
  --color-ip-highlight: #93c5fd;
  --shadow-elevated: rgba(2, 6, 23, 0.55);
  --shadow-success: rgba(34, 197, 94, 0.25);
  --shadow-hover: rgba(96, 165, 250, 0.35);
  --shadow-modal: rgba(2, 6, 23, 0.6);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-theme="dark"]) {
    color-scheme: dark;
    --color-bg: #0b1120;
    --color-text: #e2e8f0;
    --color-heading: #f8fafc;
    --color-subtext: #94a3b8;
    --color-muted: #94a3b8;
    --color-muted-soft: #a5b4cf;
    --color-muted-strong: #cbd5f5;
    --color-placeholder: #94a3b8;
    --color-surface: #111c2f;
    --color-surface-subtle: #16243c;
    --color-surface-alt: #1b2a44;
    --color-border: rgba(148, 163, 184, 0.25);
    --color-border-strong: rgba(148, 163, 184, 0.4);
    --color-chip-neutral-bg: rgba(148, 163, 184, 0.14);
    --color-chip-neutral-text: #e2e8f0;
    --color-chip-neutral-border: rgba(148, 163, 184, 0.35);
    --color-accent: #60a5fa;
    --color-accent-strong: #93c5fd;
    --color-accent-soft: rgba(96, 165, 250, 0.18);
    --color-accent-text-contrast: #041019;
    --color-success: #34d399;
    --color-success-bg: rgba(34, 197, 94, 0.22);
    --color-success-soft: rgba(22, 101, 52, 0.4);
    --color-success-border: rgba(34, 197, 94, 0.45);
    --color-danger: #f87171;
    --color-danger-bg: rgba(248, 113, 113, 0.24);
    --color-danger-border: rgba(248, 113, 113, 0.45);
    --color-danger-soft: rgba(127, 29, 29, 0.35);
    --color-danger-soft-border: rgba(248, 113, 113, 0.38);
    --color-danger-strong: #f87171;
    --color-danger-intense: #f87171;
    --color-warning: #fbbf24;
    --color-warning-strong: #f59e0b;
    --color-info: #38bdf8;
    --color-modal-backdrop: rgba(2, 6, 23, 0.7);
    --color-ghost-border: rgba(148, 163, 184, 0.45);
    --color-ip-highlight: #93c5fd;
    --shadow-elevated: rgba(2, 6, 23, 0.55);
    --shadow-success: rgba(34, 197, 94, 0.25);
    --shadow-hover: rgba(96, 165, 250, 0.35);
    --shadow-modal: rgba(2, 6, 23, 0.6);
  }
}
* { box-sizing: border-box; }
body {
  font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  background: var(--color-bg);
  color: var(--color-text);
  margin: 0;
  padding: 20px;
  transition: background-color 0.24s ease, color 0.24s ease;
}
h1 {
  margin: 0;
  font-size: 28px;
  font-weight: 700;
  color: var(--color-heading);
}
h2 {
  margin: 0;
  font-size: 20px;
  font-weight: 600;
  color: var(--color-heading);
}
a { color: inherit; }
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 20px;
}
.summary {
  background: var(--color-surface);
  border-radius: 16px;
  padding: 16px 20px;
  box-shadow: 0 8px 24px var(--shadow-elevated);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 18px;
  margin-bottom: 20px;
}
.summary-metrics {
  display: flex;
  flex-wrap: wrap;
  gap: 18px;
}
.summary-actions {
  display: flex;
  gap: 10px;
  margin-left: auto;
}
.summary-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--color-heading);
}
.summary-toggle input[type="checkbox"] {
  width: 16px;
  height: 16px;
  margin: 0;
}
.summary-actions button.device-edit-active {
  background: var(--color-danger-bg);
  border-color: var(--color-danger-border);
  color: var(--color-danger);
}
.global-panel {
  background: var(--color-surface);
  border-radius: 16px;
  padding: 18px 20px;
  box-shadow: 0 8px 24px var(--shadow-elevated);
  display: flex;
  flex-direction: column;
  gap: 16px;
  margin-bottom: 20px;
}
.global-panel h2 {
  margin: 0;
  font-size: 18px;
  font-weight: 700;
}
.global-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}
.global-header .global-updated {
  font-size: 12px;
}
.global-layout {
  display: grid;
  grid-template-columns: 1fr;
  gap: 20px;
  align-items: start;
}
.global-primary {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.global-section {
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 18px 20px;
  border: 1px solid var(--color-border);
  border-radius: 18px;
  background: var(--color-surface);
}
.global-section-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--color-heading);
}
.global-section-header {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  flex-wrap: wrap;
  gap: 8px;
}
.global-section-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-start;
  gap: 8px;
}
.global-form {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
  align-items: start;
}
.global-form .field {
  min-width: 0;
}
.global-form .field.compact {
  max-width: 140px;
}
.global-form .domain-field,
.global-form .header-field {
  grid-column: 1 / -1;
}
.global-form .domain-field {
  min-width: 240px;
}
.global-form textarea {
  min-height: 120px;
}
.header-field textarea {
  min-height: 220px;
}
.domain-radio-group {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
}
.domain-radio-group label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: 500;
  font-size: 14px;
}
.domain-radio-group input[type="radio"] {
  width: 16px;
  height: 16px;
}
.global-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.global-schedule {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.global-schedule-card {
  background: var(--color-surface-subtle);
  border: 1px solid var(--color-border);
  border-radius: 14px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
.global-schedule-card.active {
  border-color: var(--color-success);
  box-shadow: 0 10px 28px var(--shadow-success);
}
.global-schedule-body {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.global-schedule-card .schedule-time-input {
  flex: 0 0 96px;
  padding: 8px 10px;
  border: 1px solid var(--color-border-strong);
  border-radius: 10px;
  background: var(--color-surface);
  font-size: 13px;
  text-align: center;
}
.global-schedule-card .schedule-time-input:focus {
  border-color: var(--color-accent);
  outline: none;
  box-shadow: 0 0 0 3px var(--color-accent-soft);
}
.global-schedule-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 16px;
  font-size: 12px;
  color: var(--color-muted);
}
.global-schedule-meta strong {
  color: var(--color-heading);
  font-weight: 600;
}
.global-schedule-hint {
  font-size: 11px;
  color: var(--color-muted-soft);
}
.global-schedule-hint.error {
  color: var(--color-danger);
}
.schedule-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.schedule-toggle {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 600;
  color: var(--color-heading);
}
.schedule-toggle input[type="checkbox"] {
  width: 18px;
  height: 18px;
}
.schedule-status-pill {
  font-size: 12px;
  font-weight: 600;
  padding: 4px 12px;
  border-radius: 999px;
  background: var(--color-chip-neutral-bg);
  color: var(--color-muted);
}
.schedule-status-pill.active {
  background: var(--color-success-bg);
  color: var(--color-success);
}
.schedule-time-field {
  gap: 8px;
}
.schedule-time-input {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.schedule-time-input input {
  flex: 1 1 120px;
}
.schedule-time-actions {
  display: flex;
  gap: 6px;
  align-items: center;
}
.schedule-time-actions.hidden {
  display: none;
}
.schedule-input-disabled {
  background: var(--color-surface-subtle) !important;
  color: var(--color-placeholder);
}
.schedule-input-disabled::placeholder {
  color: var(--color-border-strong);
}
.schedule-status-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.schedule-status-grid .status-item {
  flex: 1 1 140px;
  background: var(--color-surface);
  border-radius: 10px;
  padding: 10px 12px;
  border: 1px solid var(--color-border);
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.schedule-status-grid .status-label {
  font-size: 11px;
  color: var(--color-muted-soft);
  font-weight: 600;
}
.schedule-status-grid .status-value {
  font-size: 14px;
  font-weight: 600;
  color: var(--color-text);
}
.field-hint {
  font-size: 12px;
  color: var(--color-muted-soft);
}
.field-hint.muted {
  color: var(--color-muted);
}
.field-error {
  font-size: 12px;
  color: var(--color-danger);
}
.field-unsaved {
  font-size: 12px;
  color: var(--color-info);
  font-weight: 600;
}
.hidden {
  display: none !important;
}
.global-status {
  font-size: 12px;
  min-height: 16px;
  color: var(--color-muted);
}
.global-status.success {
  color: var(--color-success);
}
.global-status.error {
  color: var(--color-danger);
}
.global-updated {
  font-size: 12px;
  color: var(--color-subtext);
}
.summary-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 14px;
}
.summary-item span {
  font-weight: 600;
  font-size: 16px;
}
.device-grid {
  display: grid;
  gap: var(--card-gap);
  grid-template-columns: repeat(var(--card-columns), minmax(var(--card-min-width), 1fr));
  align-items: stretch;
}
.card {
  background: var(--color-surface);
  border-radius: 10px;
  padding: 12px;
  box-shadow: 0 6px 14px var(--shadow-elevated);
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.card.offline {
  opacity: 0.6;
}
.card.online-hidden {
  display: none;
}
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}
.card-header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}
button.card-delete-btn {
  display: none;
  padding: 6px 12px;
  font-size: 12px;
}
button.card-delete-btn.danger {
  background: var(--color-danger-strong);
}
button.card-delete-btn:disabled {
  opacity: 0.7;
  cursor: wait;
}
.card.editing button.card-delete-btn {
  display: inline-flex;
}
.device-title {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 4px;
}
.meta {
  font-size: 11px;
  color: var(--color-muted-soft);
  line-height: 1.45;
}
.ip-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 10px;
  border: 1px solid var(--color-border);
  border-radius: 10px;
  background: var(--color-surface-subtle);
  font-size: 13px;
}
.ip-row.offline {
  opacity: 0.6;
}
.ip-label {
  font-weight: 600;
  color: var(--color-heading);
}
.ip-value {
  font-family: "SFMono-Regular", "Consolas", "Menlo", monospace;
  font-size: 13px;
  color: var(--color-ip-highlight);
}
.ip-placeholder {
  color: var(--color-placeholder);
}
.status-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
}
.status-connected { background: var(--color-success-bg); color: var(--color-success); }
.status-disconnected { background: var(--color-danger-bg); color: var(--color-danger); }
.status-unknown { background: var(--color-chip-neutral-bg); color: var(--color-muted); }
.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
}
.domain-toggle {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}
.domain-option {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.domain-toggle label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--color-muted);
  padding: 4px 8px;
  border-radius: 999px;
  transition: background-color 0.16s ease, color 0.16s ease;
}
.domain-toggle label.checked {
  background: var(--color-accent-soft);
  color: var(--color-accent-strong);
  font-weight: 600;
}
.domain-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 38px;
  padding: 2px 7px;
  border-radius: 999px;
  background: var(--color-chip-neutral-bg);
  font-size: 11px;
  font-weight: 600;
  color: var(--color-muted-strong);
}
.domain-toggle label.checked .domain-count {
  background: var(--color-accent);
  color: var(--color-accent-text-contrast);
}
.domain-count.complete {
  background: var(--color-success-bg);
  color: var(--color-success);
}
.domain-toggle label.checked .domain-count.complete {
  background: var(--color-success-bg);
  color: var(--color-success);
}
.domain-option button.domain-add-btn {
  padding: 4px 10px;
  font-size: 11px;
}
.domain-summary {
  font-size: 12px;
  color: var(--color-muted);
  margin: 4px 0 0 0;
}
.domain-cycle {
  font-size: 12px;
  color: var(--color-success);
  margin: 2px 0 0 0;
  display: none;
  align-items: center;
  gap: 6px;
}
.domain-cycle.active {
  display: inline-flex;
}
.cycle-badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--color-success-bg);
  color: var(--color-success);
  font-weight: 600;
  font-size: 11px;
}
.cycle-meta {
  font-size: 11px;
  color: var(--color-muted-soft);
}
.config-block {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.field-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.field-row.helo-row {
  flex-wrap: nowrap;
  align-items: flex-end;
}
.field-row.helo-row .field {
  flex: 1 1 auto;
  min-width: 0;
}
.field-row.helo-row .field.compact {
  flex: 0 0 110px;
}
.field-row.helo-row .field.compact input {
  width: 100%;
}
@media (max-width: 640px) {
  .field-row.helo-row {
    flex-wrap: wrap;
  }
}
.field-row .field {
  flex: 1 1 160px;
}
.field.compact {
  flex: 0 0 100px;
}
.field.compact input {
  text-align: right;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 13px;
  color: var(--color-heading);
}
.field span { font-weight: 600; }
.field input,
.field textarea {
  padding: 8px 10px;
  border: 1px solid var(--color-border-strong);
  border-radius: 10px;
  background: var(--color-surface-subtle);
  font-size: 13px;
  font-family: inherit;
  color: var(--color-text);
}
.field textarea {
  min-height: 100px;
  resize: vertical;
}
.input-with-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
}
.input-with-toggle input {
  flex: 1 1 auto;
}
.password-toggle-btn {
  min-width: 64px;
}
.input-compact {
  max-width: 88px;
}
.action-bar {
  display: flex;
  align-items: flex-end;
  gap: 12px;
  flex-wrap: wrap;
}
.rcpt-field {
  flex: 1 1 220px;
}
.action-buttons {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.device-schedule {
  margin-top: 12px;
  border: 1px solid var(--color-border);
  border-radius: 12px;
  background: var(--color-surface);
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.device-schedule-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.device-schedule .schedule-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  color: var(--color-heading);
}
.device-schedule input[type="checkbox"] {
  width: 16px;
  height: 16px;
}
.device-schedule-pill {
  font-size: 12px;
  font-weight: 600;
  color: var(--color-muted);
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--color-surface-subtle);
  border: 1px solid var(--color-border);
}
.device-schedule.active .device-schedule-pill,
.device-schedule-pill[data-state="active"] {
  color: var(--color-accent-strong);
  border-color: var(--color-accent);
  background: var(--color-accent-soft);
}
.device-schedule-body {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.schedule-time-wrapper {
  display: flex;
  align-items: center;
  gap: 8px;
}
.schedule-time-wrapper button[disabled] {
  opacity: 0.5;
  cursor: not-allowed;
}
.device-schedule .schedule-time-input {
  flex: 0 0 90px;
  padding: 8px 10px;
  border: 1px solid var(--color-border-strong);
  border-radius: 10px;
  background: var(--color-surface-subtle);
  font-size: 13px;
  text-align: center;
}
.device-schedule .schedule-time-input:disabled {
  background: var(--color-surface-subtle);
  color: var(--color-muted);
}
.device-schedule-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 16px;
  font-size: 12px;
  color: var(--color-muted);
}
.device-schedule-meta strong {
  color: var(--color-heading);
  font-weight: 600;
}
.device-schedule-meta strong[data-state="pending-reset"] {
  color: var(--color-warning-strong);
}
.device-schedule-hint {
  font-size: 11px;
  color: var(--color-muted-soft);
  margin-top: 4px;
}

.imap-block {
  margin-top: 14px;
  padding: 12px 14px;
  border: 1px solid var(--color-border);
  border-radius: 10px;
  background: var(--color-surface-subtle);
}

.imap-block.hidden {
  display: none;
}

.imap-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}

.imap-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
  color: var(--color-heading);
}

.imap-toggle input[type="checkbox"] {
  width: 18px;
  height: 18px;
}

.imap-status {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 4px;
  color: var(--color-muted-strong);
}

.imap-status.success {
  color: var(--color-success);
}

.imap-status.warning {
  color: var(--color-warning);
}

.imap-status.error {
  color: var(--color-danger);
}

.imap-status.off {
  color: var(--color-muted);
}

.imap-meta {
  font-size: 12px;
  color: var(--color-subtext);
  line-height: 1.5;
}

#imapModal .modal-card {
  width: 380px;
  max-width: calc(100vw - 40px);
}

.imap-form .field {
  margin-bottom: 14px;
}

.imap-form label span {
  display: block;
  font-size: 13px;
  color: var(--color-subtext);
  margin-bottom: 4px;
}

.imap-form small {
  font-weight: 400;
  color: var(--color-muted);
}

.imap-form input[type="number"] {
  width: 100%;
}

.imap-form .checkbox-field {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.imap-form .checkbox-field span {
  margin-bottom: 0;
}

.imap-anchor-meta {
  margin-top: 6px;
  font-size: 12px;
  color: var(--color-muted);
}

.imap-anchor-meta strong {
  color: var(--color-text);
}
button {
  cursor: pointer;
  border: none;
  border-radius: 10px;
  padding: 8px 16px;
  font-weight: 600;
  font-size: 13px;
  background: var(--color-accent);
  color: var(--color-accent-text-contrast);
  transition: transform 0.12s ease, box-shadow 0.16s ease;
}
button.small {
  padding: 6px 12px;
  font-size: 12px;
}
button.secondary {
  background: var(--color-border);
  color: var(--color-muted-strong);
}
button.secondary.is-running,
button.secondary.is-running:disabled {
  background: var(--color-success);
  color: var(--color-accent-text-contrast);
  box-shadow: 0 10px 18px var(--shadow-success);
  opacity: 1;
  cursor: not-allowed;
}
button.ghost {
  background: transparent;
  border: 1px solid var(--color-ghost-border);
  color: var(--color-heading);
}
button.danger {
  background: var(--color-danger-strong);
}
button:disabled {
  cursor: not-allowed;
  opacity: 0.6;
  box-shadow: none;
}
button:not(:disabled):hover {
  transform: translateY(-1px);
  box-shadow: 0 10px 18px var(--shadow-hover);
}
.log-box {
  border: 1px solid var(--color-border);
  border-radius: 12px;
  padding: 12px;
  background: var(--color-surface);
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 180px;
}
.log-box-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}
.log-box-heading {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.log-box h4,
.log-box-header h4 {
  margin: 0;
  font-size: 13px;
  font-weight: 600;
}
.log-stats {
  font-size: 12px;
  font-weight: 600;
  color: var(--color-muted-strong);
}
.log-stats.secondary {
  font-weight: 500;
  color: var(--color-muted);
}
.log-stats.secondary[data-state="running"] {
  color: var(--color-accent);
}
.log-stats.secondary[data-state="cancelling"] {
  color: var(--color-warning);
}
.log-stats.secondary[data-state="success"] {
  color: var(--color-success);
}
.log-stats.secondary[data-state="failed"] {
  color: var(--color-danger);
}
.log-stats.secondary[data-state="cancelled"] {
  color: var(--color-warning-strong);
}
.log-clear-btn {
  padding: 4px 10px;
  font-size: 11px;
}
.log-list {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  font-size: 12px;
  color: var(--color-muted);
}
.log-item {
  border: 1px solid var(--color-border);
  border-radius: 10px;
  padding: 10px;
  background: var(--color-surface-alt);
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.log-item.ok {
  background: var(--color-success-soft);
  border-color: var(--color-success-border);
  color: var(--color-success);
}
.log-item.fail {
  background: var(--color-danger-soft);
  border-color: var(--color-danger-soft-border);
  color: var(--color-danger);
}
.log-meta {
  font-size: 11px;
  color: var(--color-subtext);
}
.log-text {
  font-family: "SFMono-Regular", "Menlo", "Consolas", monospace;
  font-size: 12px;
  line-height: 1.4;
  color: var(--color-heading);
  word-break: break-all;
}

.inline-field {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--color-heading);
}
.inline-field span {
  font-weight: 600;
}
.inline-field input,
.inline-field select {
  padding: 6px 8px;
  border: 1px solid var(--color-border-strong);
  border-radius: 8px;
  background: var(--color-surface-subtle);
  font-size: 13px;
  font-family: inherit;
  color: var(--color-text);
}
.inline-field input {
  width: 64px;
  text-align: center;
}
.inline-field select {
  min-width: 120px;
}
.empty-hint {
  margin-top: 32px;
  text-align: center;
  font-size: 14px;
  color: var(--color-muted-soft);
}
.notice {
  font-size: 12px;
  font-weight: 600;
}
.notice.success { color: var(--color-success); }
.notice.error { color: var(--color-danger); }

.modal {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--color-modal-backdrop);
  z-index: 50;
  padding: 24px;
}
.modal.hidden { display: none; }
.modal-card {
  background: var(--color-surface);
  border-radius: 18px;
  width: min(900px, 95vw);
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 20px 36px var(--shadow-modal);
}
.modal-header {
  padding: 18px 22px;
  border-bottom: 1px solid var(--color-border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.modal-body {
  padding: 18px 22px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.modal-footer {
  padding: 16px 22px;
  border-top: 1px solid var(--color-border);
  display: flex;
  justify-content: center;
  gap: 12px;
}
.file-upload {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}
.file-upload input[type="file"] {
  font-size: 13px;
}
.file-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
.file-table th,
.file-table td {
  padding: 10px;
  border-bottom: 1px solid var(--color-border);
  text-align: left;
  vertical-align: top;
}
.file-table th {
  background: var(--color-surface-subtle);
  font-weight: 700;
  color: var(--color-muted-strong);
}
.file-ops {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.preview-box {
  border: 1px solid var(--color-border);
  border-radius: 12px;
  background: var(--color-surface-subtle);
  padding: 12px;
  font-family: "D2Coding", "Courier New", monospace;
  font-size: 12px;
  white-space: pre-wrap;
  max-height: 220px;
  overflow-y: auto;
}
.modal-message {
  font-size: 12px;
  color: var(--color-danger-intense);
}
.modal-message.success {
  color: var(--color-success);
}

.refresh-group {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.last-sync {
  font-size: 12px;
  color: var(--color-muted-soft);
}

@media (max-width: 960px) {
  :root { --card-min-width: 180px; }
}

@media (max-width: 720px) {
  body { padding: 16px; }
  header { flex-direction: column; align-items: flex-start; }
}
</style>
</head>
<body>
<header>
  <div>
    <h1>메일 발송 제어 대시보드</h1>
    <div class="last-sync" id="lastSync"></div>
  </div>
  <div class="refresh-group">
    <label class="inline-field" for="cardColumnsInput">
      <span>카드 열 수</span>
      <input type="number" id="cardColumnsInput" min="2" max="6" step="1" value="4">
    </label>
    <label class="inline-field" for="themeSelect">
      <span>테마</span>
      <select id="themeSelect">
        <option value="light">라이트</option>
        <option value="dark">다크</option>
        <option value="system">시스템</option>
      </select>
    </label>
    <button class="secondary" id="refreshBtn">새로 고침</button>
  </div>
</header>

<section class="global-panel" id="globalPanel">
  <div class="global-header">
    <h2>공통 발송 설정</h2>
    <div class="global-updated" id="globalUpdatedAt">아직 적용 기록이 없습니다.</div>
  </div>
  <div class="global-layout">
    <div class="global-primary">
      <div class="global-section">
        <div class="global-section-header">
          <h3 class="global-section-title">발송 제어</h3>
          <div class="global-actions global-section-actions">
            <button id="globalApplyBtn">설정 적용</button>
            <button class="secondary" id="globalSendAllBtn">전체 발송</button>
            <button class="danger" id="globalStopAllBtn">전체 중지</button>
          </div>
        </div>
        <div class="global-form">
          <div class="field domain-field">
            <span>활성 도메인</span>
            <div class="domain-radio-group" id="globalActiveDomainGroup">
              <label>
                <input type="radio" name="globalActiveDomain" value="naver">
                네이버
              </label>
              <label>
                <input type="radio" name="globalActiveDomain" value="daum">
                다음
              </label>
            </div>
          </div>
          <label class="field">
            <span>HELO</span>
            <input type="text" id="globalHelo" placeholder="예: mail.example.com">
          </label>
          <label class="field">
            <span>MAIL FROM</span>
            <input type="text" id="globalMailFrom" placeholder="sender@example.com">
          </label>
          <label class="field compact">
            <span>세션 수</span>
            <input type="number" id="globalSessionCount" min="1" step="1" placeholder="1 이상">
          </label>
          <label class="field compact">
            <span>BCC 수</span>
            <input type="number" id="globalBccCount" min="0" max="30" step="1" placeholder="0~30">
          </label>
          <label class="field header-field">
            <span>HEADER</span>
            <textarea id="globalHeader" placeholder="헤더를 입력하세요"></textarea>
          </label>
        </div>
      </div>
      <div class="global-section">
        <h3 class="global-section-title">시간 제어</h3>
        <div class="global-schedule">
          <div class="global-schedule-card" id="globalScheduleCard">
            <div class="schedule-header">
              <label class="schedule-toggle">
                <input type="checkbox" id="globalStopScheduleToggle">
                <span>자동 중지</span>
              </label>
              <span class="schedule-status-pill" id="globalStopSchedulePill">비활성</span>
            </div>
            <div class="global-schedule-body">
              <div class="schedule-time-wrapper">
                <input type="text" class="schedule-time-input" id="globalStopScheduleTime" inputmode="numeric" maxlength="5" autocomplete="off" spellcheck="false" placeholder="예: 02:30">
              </div>
              <div class="global-schedule-meta">
                <span>다음 실행: <strong id="globalStopScheduleNext">--</strong></span>
                <span>마지막 실행: <strong id="globalStopScheduleLast">--</strong></span>
              </div>
              <div class="global-schedule-hint" id="globalStopScheduleHint">HH:MM 형식으로 입력하세요.</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="global-status" id="globalStatus"></div>
</section>

<section class="summary" id="summaryBar">
  <div class="summary-metrics">
    <div class="summary-item">
      총 디바이스
      <span id="summaryTotal">0</span>
    </div>
    <div class="summary-item">
      온라인
      <span id="summaryOnline">0</span>
    </div>
  </div>
  <div class="summary-actions">
    <label class="summary-toggle">
      <input type="checkbox" id="onlineOnlyToggle">
      온라인만 보기
    </label>
    <button type="button" class="ghost small" id="editDevicesBtn" title="디바이스 카드 삭제 모드를 켭니다." disabled>편집</button>
  </div>
</section>

<div id="deviceContainer" class="device-grid"></div>
<div id="emptyHint" class="empty-hint" style="display:none;">등록된 디바이스가 없습니다. 클라이언트에서 서버에 연결하면 여기에 표시됩니다.</div>

<div id="fileModal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-header">
      <div>
        <h2 id="modalTitle">파일 관리</h2>
        <div class="meta" id="modalSubtitle"></div>
      </div>
      <button class="ghost" id="modalCloseBtn">닫기</button>
    </div>
    <div class="modal-body">
      <div class="modal-message" id="modalMessage"></div>
      <div class="file-upload">
        <label for="fileInput" class="field">
          <span>새 DB 파일 업로드</span>
          <input id="fileInput" type="file" accept=".db,.sqlite,.sqlite3,.txt">
        </label>
        <button id="fileUploadBtn">업로드</button>
        <button class="danger" id="purgeDbBtn">DB 전체 삭제</button>
      </div>
      <div id="fileListContainer"></div>
      <div>
        <h4 style="margin:16px 0 8px 0;font-size:13px;font-weight:600;">미리보기</h4>
        <div id="previewBox" class="preview-box">파일을 선택하면 미리보기가 표시됩니다.</div>
      </div>
    </div>
  </div>
</div>

<div id="imapModal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-header">
      <div>
        <h2 id="imapModalTitle">네이버 IMAP 설정</h2>
        <div class="meta" id="imapModalSubtitle"></div>
      </div>
      <button class="ghost" data-action="close-imap">닫기</button>
    </div>
    <div class="modal-body">
      <div class="modal-message" id="imapModalMessage"></div>
      <form id="imapForm" class="imap-form" autocomplete="off">
        <label class="field">
          <span>네이버 계정 ID</span>
          <input type="text" id="imapUsername" autocomplete="username" required>
        </label>
        <label class="field">
          <span>비밀번호 <small>(변경 시에만 입력)</small></span>
          <div class="input-with-toggle">
            <input type="password" id="imapPassword" autocomplete="new-password" placeholder="">
            <button type="button" class="ghost small password-toggle-btn" data-action="imap-password-toggle" aria-pressed="false">보기</button>
          </div>
        </label>
        <label class="field">
          <span>허용 지연 시간 (초)</span>
          <input type="number" id="imapDelaySeconds" min="5" max="600" required title="발송 후 IMAP으로 도착 여부를 확인할 때 허용할 최대 대기 시간입니다. 알박기 메일도 이 값을 기준으로 확인합니다.">
        </label>
        <p class="field-hint">알박기 메일도 동일한 허용 지연을 사용하며, 상황에 따라 대기 시간이 자동 조정됩니다.</p>
      </form>
    </div>
    <div class="modal-footer">
      <button type="button" class="ghost" data-action="imap-cancel">취소</button>
      <button type="button" class="secondary" id="imapTestBtn" data-action="imap-test">연결 테스트</button>
      <button type="button" id="imapSaveBtn" data-action="imap-save">저장</button>
    </div>
  </div>
</div>

<script>
const GLOBAL_FIELD_LIST = [
  "active_domain",
  "helo",
  "mail_from",
  "header",
  "session_count",
  "bcc_count",
  "stop_schedule_enabled",
  "stop_schedule_time",
];
const GLOBAL_DEFAULTS = {
  active_domain: "naver",
  helo: "",
  mail_from: "",
  header: "",
  session_count: "1",
  bcc_count: "0",
  stop_schedule_enabled: false,
  stop_schedule_time: "",
};
const GLOBAL_INPUT_IDS = {
  active_domain: "globalActiveDomainGroup",
  helo: "globalHelo",
  mail_from: "globalMailFrom",
  header: "globalHeader",
  session_count: "globalSessionCount",
  bcc_count: "globalBccCount",
  stop_schedule_enabled: "globalStopScheduleToggle",
  stop_schedule_time: "globalStopScheduleTime",
};

const IMAP_DEFAULT_DELAY = 20;
const IMAP_MIN_DELAY = 5;
const IMAP_MAX_DELAY = 600;

const state = {
  devices: [],
  lastSync: null,
  modal: {
    open: false,
    deviceId: null,
    domain: null,
    deviceName: "",
  },
  imapModal: {
    open: false,
    deviceId: null,
    domain: "naver",
    deviceName: "",
    passwordSaved: false,
    forceEnable: false,
    card: null,
    testJobId: null,
  },
  pollingHandle: null,
  successCounters: {},
  globalConfig: { ...GLOBAL_DEFAULTS, updated_at: null, stop_schedule_last_run: null, stop_schedule_next_run: null },
  globalDraft: { ...GLOBAL_DEFAULTS },
  globalDirty: {
    active_domain: false,
    helo: false,
    mail_from: false,
    header: false,
    session_count: false,
    bcc_count: false,
    stop_schedule_enabled: false,
    stop_schedule_time: false,
  },
  globalStatusTimer: null,
  globalScheduleError: "",
  deviceEditMode: false,
  filterOnlineOnly: false,
  deletingDevices: new Set(),
};

removeLegacyHiddenOfflinePreference();
state.filterOnlineOnly = loadOnlineOnlyPreference();

const DOMAIN_LABELS = { naver: "네이버", daum: "다음" };
const STATUS_LABELS = {
  connected: "온라인",
  disconnected: "오프라인",
};
const JOB_STATUS_LABELS = {
  pending: "대기 중",
  dispatched: "전송 준비",
  running: "진행 중",
  success: "완료",
  failed: "실패",
  cancelled: "중지됨",
};
const ACTIVE_JOB_STATES = new Set(["pending", "dispatched", "running"]);

const CONFIG_FIELDS = ["helo", "mail_from", "header", "session_count", "bcc_count", "anchor_interval", "anchor_email", "rcpt_to"];
const CARD_COLUMNS_KEY = "dashboard.cardColumns";
const CARD_COLUMNS_MIN = 2;
const CARD_COLUMNS_MAX = 6;
const CARD_COLUMNS_DEFAULT = 4;
const BCC_MIN = 1;
const BCC_MAX = 30;
const ANCHOR_MIN = 1;
const ANCHOR_MAX = 1000;
const fieldCache = {};
const cardRegistry = {};
const ONLINE_ONLY_KEY = "dashboard.onlineOnlyFilter";
const LEGACY_HIDDEN_OFFLINE_KEY = "dashboard.hiddenOfflineDevices";
const THEME_STORAGE_KEY = "dashboard.themePreference";
const VALID_THEMES = ["light", "dark", "system"];
let themePreference = "system";
const prefersDarkQuery = typeof window !== "undefined" && typeof window.matchMedia === "function"
  ? window.matchMedia("(prefers-color-scheme: dark)")
  : null;

function isValidTheme(value) {
  return VALID_THEMES.includes(value);
}

function loadThemePreference() {
  try {
    const stored = localStorage.getItem(THEME_STORAGE_KEY);
    if (isValidTheme(stored)) {
      return stored;
    }
  } catch (err) {
    console.warn("테마 설정을 불러오지 못했습니다.", err);
  }
  return "system";
}

function persistThemePreference(theme) {
  try {
    localStorage.setItem(THEME_STORAGE_KEY, theme);
  } catch (err) {
    console.warn("테마 설정 저장에 실패했습니다.", err);
  }
}

function applyThemePreference(theme) {
  const root = document.documentElement;
  if (theme === "light") {
    root.setAttribute("data-theme", "light");
  } else if (theme === "dark") {
    root.setAttribute("data-theme", "dark");
  } else {
    root.removeAttribute("data-theme");
    theme = "system";
  }
  root.dataset.themePreference = theme;
}

function syncThemeSelect(theme) {
  const select = document.getElementById("themeSelect");
  if (select && select.value !== theme) {
    select.value = theme;
  }
}

function handleThemeSelectChange(event) {
  const next = event.target.value;
  themePreference = isValidTheme(next) ? next : "system";
  persistThemePreference(themePreference);
  applyThemePreference(themePreference);
}

function handleSystemThemeChange() {
  if (themePreference === "system") {
    applyThemePreference("system");
  }
}

function initThemeControl() {
  themePreference = loadThemePreference();
  applyThemePreference(themePreference);
  syncThemeSelect(themePreference);
  const select = document.getElementById("themeSelect");
  if (select) {
    select.addEventListener("change", handleThemeSelectChange);
  }
  if (prefersDarkQuery) {
    if (typeof prefersDarkQuery.addEventListener === "function") {
      prefersDarkQuery.addEventListener("change", handleSystemThemeChange);
    } else if (typeof prefersDarkQuery.addListener === "function") {
      prefersDarkQuery.addListener(handleSystemThemeChange);
    }
  }
}

function clampNumber(value, min, max, fallback) {
  const parsed = typeof value === "number" ? value : parseInt(value, 10);
  if (Number.isNaN(parsed)) {
    return fallback;
  }
  return Math.min(max, Math.max(min, parsed));
}

function loadOnlineOnlyPreference() {
  try {
    const stored = localStorage.getItem(ONLINE_ONLY_KEY);
    return stored === "true";
  } catch (err) {
    console.warn("온라인 필터 설정을 불러오지 못했습니다.", err);
    return false;
  }
}

function persistOnlineOnlyPreference(enabled) {
  try {
    localStorage.setItem(ONLINE_ONLY_KEY, enabled ? "true" : "false");
  } catch (err) {
    console.warn("온라인 필터 설정 저장에 실패했습니다.", err);
  }
}

function removeLegacyHiddenOfflinePreference() {
  try {
    localStorage.removeItem(LEGACY_HIDDEN_OFFLINE_KEY);
  } catch (err) {
    console.warn("이전 숨김 오프라인 설정 제거에 실패했습니다.", err);
  }
}

function parseBccInput(value) {
  if (value === undefined || value === null) return 0;
  const trimmed = String(value).trim();
  if (!trimmed) return 0;
  if (trimmed === "0") return 0;
  return clampNumber(trimmed, BCC_MIN, BCC_MAX, BCC_MIN);
}

function formatBccValue(value) {
  const parsed = typeof value === "number" ? value : parseInt(value, 10);
  if (Number.isNaN(parsed) || parsed <= 0) {
    return "0";
  }
  return String(clampNumber(parsed, BCC_MIN, BCC_MAX, BCC_MIN));
}

function parseAnchorInput(value) {
  if (value === undefined || value === null) return 0;
  const trimmed = String(value).trim();
  if (!trimmed) return 0;
  if (trimmed === "0") return 0;
  return clampNumber(trimmed, ANCHOR_MIN, ANCHOR_MAX, ANCHOR_MIN);
}

function formatAnchorValue(value) {
  const parsed = typeof value === "number" ? value : parseInt(value, 10);
  if (Number.isNaN(parsed) || parsed <= 0) {
    return "0";
  }
  return String(clampNumber(parsed, ANCHOR_MIN, ANCHOR_MAX, ANCHOR_MIN));
}

function sanitizeSessionValue(value) {
  const parsed = parseInt(String(value ?? "").trim(), 10);
  if (Number.isNaN(parsed) || parsed < 1) {
    return "1";
  }
  return String(parsed);
}

function sanitizeBccValue(value) {
  const trimmed = String(value ?? "").trim();
  if (!trimmed || trimmed === "0") {
    return "0";
  }
  const parsed = parseInt(trimmed, 10);
  if (Number.isNaN(parsed) || parsed <= 0) {
    return "0";
  }
  return String(clampNumber(parsed, BCC_MIN, BCC_MAX, BCC_MIN));
}

function sanitizeGlobalDomain(value) {
  const candidate = String(value ?? "").trim().toLowerCase();
  if (candidate === "daum") {
    return "daum";
  }
  return "naver";
}

function normalizeDeviceDomain(value) {
  const candidate = String(value ?? "").trim().toLowerCase();
  if (candidate === "daum") {
    return "daum";
  }
  if (candidate === "naver") {
    return "naver";
  }
  return "naver";
}

function sanitizeScheduleTime(value) {
  if (value === undefined || value === null) {
    return "";
  }
  const trimmed = String(value).trim();
  if (!trimmed) {
    return "";
  }
  const match = trimmed.match(/^([0-1]?\d|2[0-3]):([0-5]\d)$/);
  if (!match) {
    return "";
  }
  const hours = match[1].padStart(2, "0");
  const minutes = match[2];
  return `${hours}:${minutes}`;
}

function sanitizeAnchorValue(value) {
  const trimmed = String(value ?? "").trim();
  if (!trimmed || trimmed === "0") {
    return "0";
  }
  const parsed = parseInt(trimmed, 10);
  if (Number.isNaN(parsed) || parsed <= 0) {
    return "0";
  }
  return String(clampNumber(parsed, ANCHOR_MIN, ANCHOR_MAX, ANCHOR_MIN));
}

function applyCardColumns(value) {
  document.documentElement.style.setProperty("--card-columns", value);
}

function initCardColumnControl() {
  const input = document.getElementById("cardColumnsInput");
  if (!input) return;
  const saved = clampNumber(localStorage.getItem(CARD_COLUMNS_KEY), CARD_COLUMNS_MIN, CARD_COLUMNS_MAX, CARD_COLUMNS_DEFAULT);
  applyCardColumns(saved);
  input.value = saved;
  input.addEventListener("change", () => {
    const next = clampNumber(input.value, CARD_COLUMNS_MIN, CARD_COLUMNS_MAX, CARD_COLUMNS_DEFAULT);
    input.value = next;
    applyCardColumns(next);
    localStorage.setItem(CARD_COLUMNS_KEY, next);
  });
}

function initialFieldValues(config) {
  return {
    helo: config?.helo || "",
    mail_from: config?.mail_from || "",
    header: config?.header || "",
    session_count: sanitizeSessionValue(config?.session_count ?? "1"),
    bcc_count: formatBccValue(config?.bcc_count ?? 0),
    anchor_interval: formatAnchorValue(config?.anchor_interval ?? 0),
    anchor_email: config?.anchor_email || "",
    rcpt_to: config?.rcpt_to || "",
  };
}

function ensureFieldCache(deviceId, domain, config) {
  if (!fieldCache[deviceId]) {
    fieldCache[deviceId] = {};
  }
  const store = fieldCache[deviceId];
  const defaults = initialFieldValues(config);
  if (!store[domain]) {
    store[domain] = { values: defaults, dirty: false };
  } else if (!store[domain].dirty) {
    store[domain].values = defaults;
  }
  return store[domain];
}

function markFieldDirty(deviceId, domain, field, value) {
  const entry = fieldCache[deviceId]?.[domain];
  if (!entry) {
    return;
  }
  entry.values[field] = value;
  entry.dirty = true;
}

function resetFieldDirty(deviceId, domain, config) {
  const entry = ensureFieldCache(deviceId, domain, config);
  entry.dirty = false;
}

function collectConfigPayload(card, currentDevice, domain) {
  const sessionInput = card.querySelector('[data-field="session_count"]');
  const sessionValue = sanitizeSessionValue(sessionInput?.value ?? "1");
  if (sessionInput && sessionInput.value !== sessionValue) {
    sessionInput.value = sessionValue;
  }

  const bccInput = card.querySelector('[data-field="bcc_count"]');
  const bccValue = sanitizeBccValue(bccInput?.value ?? "0");
  if (bccInput && bccInput.value !== bccValue) {
    bccInput.value = bccValue;
  }

  const anchorIntervalInput = card.querySelector('[data-field="anchor_interval"]');
  const anchorIntervalValue = sanitizeAnchorValue(anchorIntervalInput?.value ?? "0");
  if (anchorIntervalInput && anchorIntervalInput.value !== anchorIntervalValue) {
    anchorIntervalInput.value = anchorIntervalValue;
  }

  const anchorEmailInput = card.querySelector('[data-field="anchor_email"]');
  const anchorEmailValue = anchorEmailInput?.value?.trim() ?? "";

  return {
    payload: {
      helo: card.querySelector('[data-field="helo"]').value.trim(),
      smtp_host: (currentDevice.configs?.[domain]?.smtp_host || "").trim(),
      mail_from: card.querySelector('[data-field="mail_from"]').value.trim(),
      header: card.querySelector('[data-field="header"]').value,
      session_count: Number(sessionValue) || 1,
      bcc_count: parseBccInput(bccValue),
      anchor_interval: parseAnchorInput(anchorIntervalValue),
      anchor_email: anchorEmailValue,
      rcpt_to: card.querySelector('[data-field="rcpt_to"]').value.trim(),
    },
  };
}

async function saveConfig(card, currentDevice, domain) {
  const { payload } = collectConfigPayload(card, currentDevice, domain);
  const updated = await fetchJSON(`/api/devices/${currentDevice.id}/domains/${domain}/config`, {
    method: "PUT",
    body: JSON.stringify(payload),
  });
  currentDevice.configs = currentDevice.configs || {};
  currentDevice.configs[domain] = updated;
  card.__deviceData = { ...currentDevice };
  resetFieldDirty(currentDevice.id, domain, updated);
  populateConfigForm(card, currentDevice, domain);
  return updated;
}

async function ensureConfigSynced(card, currentDevice, domain) {
  const cacheEntry = fieldCache[currentDevice.id]?.[domain];
  if (!cacheEntry?.dirty) {
    return;
  }
  await saveConfig(card, currentDevice, domain);
}

function getActiveDomain(card, fallback) {
  return card.dataset.activeDomain || fallback || "naver";
}

function formatDate(iso) {
  if (!iso) return "정보 없음";
  try {
    const date = new Date(iso);
    if (Number.isNaN(date.getTime())) return iso;
    const yyyy = date.getFullYear();
    const mm = String(date.getMonth() + 1).padStart(2, "0");
    const dd = String(date.getDate()).padStart(2, "0");
    const hh = String(date.getHours()).padStart(2, "0");
    const mi = String(date.getMinutes()).padStart(2, "0");
    const ss = String(date.getSeconds()).padStart(2, "0");
    return `${yyyy}-${mm}-${dd} ${hh}:${mi}:${ss}`;
  } catch (err) {
    return iso;
  }
}

function formatCount(value) {
  const numeric = Number(value) || 0;
  return numeric.toLocaleString("ko-KR");
}

function formatScheduleDate(value) {
  if (!value) return null;
  const str = String(value).trim();
  if (!str) return null;
  if (/^\d{4}-\d{2}-\d{2}$/.test(str)) {
    return str;
  }
  return formatDate(str);
}

function computeDeviceNextRun(timeValue) {
  const sanitized = sanitizeScheduleTime(timeValue);
  if (!sanitized) return null;
  const [hh, mm] = sanitized.split(":").map((part) => Number(part) || 0);
  const now = new Date();
  const target = new Date(now);
  target.setHours(hh, mm, 0, 0);
  if (target <= now) {
    target.setDate(target.getDate() + 1);
  }
  return target.toISOString();
}

function formatScheduleInputValue(raw) {
  const digits = String(raw ?? "").replace(/\D/g, "").slice(0, 4);
  if (digits.length <= 2) {
    return digits;
  }
  const hours = digits.slice(0, 2);
  const minutes = digits.slice(2);
  return minutes ? `${hours}:${minutes}` : hours;
}

async function requestDeviceScheduleUpdate(card, device, domain, payload) {
  const normalizedDomain = normalizeDeviceDomain(domain);
  const scheduleCard = card.querySelector('[data-role="deviceSchedule"]');
  const toggle = scheduleCard?.querySelector('[data-field="stop_schedule_enabled"]');
  const timeInput = scheduleCard?.querySelector('[data-field="stop_schedule_time"]');
  const previousConfig = bestConfig(device, normalizedDomain);
  scheduleCard?.classList.add("is-updating");
  if (toggle) toggle.disabled = true;
  if (timeInput) timeInput.disabled = true;
  try {
    const result = await fetchJSON(`/api/devices/${device.id}/domains/${normalizedDomain}/schedule`, {
      method: "POST",
      body: JSON.stringify(payload),
    });
    const updatedConfig = result.config || {};
    device.configs = device.configs || {};
    device.configs[normalizedDomain] = updatedConfig;
    card.__deviceData = { ...device };
    updateDeviceSchedule(card, device, normalizedDomain, updatedConfig);
    const savedTime = sanitizeScheduleTime(updatedConfig.stop_schedule_time) || "";
    if (payload.enabled && savedTime) {
      setNotice(card, `자동 중지를 매일 ${savedTime}에 실행하도록 저장했습니다.`);
    } else if (payload.enabled) {
      setNotice(card, "예약 시간이 비어 있어 자동 중지를 비활성화했습니다.", "info");
    } else if (payload.time) {
      setNotice(card, payload.time ? `자동 중지 시간을 ${payload.time || "--"}로 저장했습니다.` : "자동 중지 시간을 비워 저장했습니다.");
    } else {
      setNotice(card, "자동 중지를 비활성화했습니다.");
    }
    return updatedConfig;
  } catch (err) {
    updateDeviceSchedule(card, device, normalizedDomain, previousConfig);
    if (toggle) {
      toggle.checked = Boolean(previousConfig?.stop_schedule_enabled);
    }
    if (timeInput) {
      timeInput.value = sanitizeScheduleTime(previousConfig?.stop_schedule_time) || "";
    }
    setNotice(card, err?.message || "스케줄 업데이트에 실패했습니다.", "error");
    throw err;
  } finally {
    scheduleCard?.classList.remove("is-updating");
    if (toggle) toggle.disabled = false;
    if (timeInput) timeInput.disabled = false;
  }
}

function updateDeviceSchedule(card, device, domain, config) {
  const scheduleCard = card.querySelector('[data-role="deviceSchedule"]');
  if (!scheduleCard) return;
  const toggle = scheduleCard.querySelector('[data-field="stop_schedule_enabled"]');
  const timeInput = scheduleCard.querySelector('[data-field="stop_schedule_time"]');
  const statusEl = scheduleCard.querySelector('[data-role="scheduleStatus"]');
  const nextRunEl = scheduleCard.querySelector('[data-role="scheduleNextRun"]');
  const lastRunEl = scheduleCard.querySelector('[data-role="scheduleLastRun"]');
  const hintEl = scheduleCard.querySelector('[data-role="scheduleHint"]');

  const enabled = Boolean(config?.stop_schedule_enabled);
  const timeValue = sanitizeScheduleTime(config?.stop_schedule_time) || "";
  const nextRunValue = enabled && timeValue
    ? formatDate(config?.stop_schedule_next_run || computeDeviceNextRun(timeValue))
    : null;
  const lastRunValue = formatScheduleDate(config?.stop_schedule_last_run);

  if (toggle) {
    toggle.checked = enabled;
  }
  if (timeInput) {
    const activeInput = document.activeElement === timeInput;
    if (!activeInput) {
      timeInput.value = timeValue;
    }
    timeInput.disabled = false;
  }

  scheduleCard.classList.toggle("active", enabled && Boolean(timeValue));
  if (statusEl) {
    if (enabled && timeValue) {
      statusEl.textContent = `${timeValue} 예정`;
      statusEl.dataset.state = "active";
    } else {
      statusEl.textContent = "비활성";
      statusEl.dataset.state = "disabled";
    }
  }
  if (nextRunEl) {
    nextRunEl.textContent = nextRunValue || "--";
  }
  if (lastRunEl) {
    if (lastRunValue) {
      lastRunEl.textContent = lastRunValue;
      lastRunEl.dataset.state = "reported";
    } else {
      lastRunEl.textContent = "--";
      lastRunEl.dataset.state = "none";
    }
  }
  if (hintEl) {
    if (!timeValue) {
      hintEl.textContent = "HH:MM 형식으로 입력하세요.";
    } else if (!enabled) {
      hintEl.textContent = `저장된 시간 ${timeValue} · 토글을 켜면 적용됩니다.`;
    } else {
      hintEl.textContent = "예약된 시간에 현재 작업이 중단됩니다.";
    }
  }
}

function setGlobalStatus(message, type = "info") {
  const statusEl = document.getElementById("globalStatus");
  if (!statusEl) return;
  if (state.globalStatusTimer) {
    clearTimeout(state.globalStatusTimer);
    state.globalStatusTimer = null;
  }
  const className = type === "success"
    ? "global-status success"
    : type === "error"
      ? "global-status error"
      : "global-status";
  statusEl.className = className;
  statusEl.textContent = message || "";
  if (message) {
    state.globalStatusTimer = setTimeout(() => {
      statusEl.className = "global-status";
      statusEl.textContent = "";
      state.globalStatusTimer = null;
    }, 4000);
  }
}

function updateGlobalScheduleUI(options = {}) {
  const { error } = options;
  if (typeof error === "string") {
    state.globalScheduleError = error;
  } else if (error === null) {
    state.globalScheduleError = "";
  }
  const toggle = document.getElementById("globalStopScheduleToggle");
  const timeInput = document.getElementById("globalStopScheduleTime");
  const cardEl = document.getElementById("globalScheduleCard");
  const pillEl = document.getElementById("globalStopSchedulePill");
  const hintEl = document.getElementById("globalStopScheduleHint");
  const nextEl = document.getElementById("globalStopScheduleNext");
  const lastEl = document.getElementById("globalStopScheduleLast");

  const rawValue = timeInput?.value ?? state.globalDraft.stop_schedule_time ?? "";
  const sanitized = sanitizeScheduleTime(rawValue);
  const toggleChecked = Boolean(toggle?.checked);
  const effectivelyEnabled = toggleChecked && Boolean(sanitized);

  if (cardEl) {
    cardEl.classList.toggle("active", effectivelyEnabled);
  }
  if (pillEl) {
    pillEl.textContent = effectivelyEnabled ? "활성" : "비활성";
    pillEl.classList.toggle("active", effectivelyEnabled);
  }
  if (nextEl) {
    const serverNext = state.globalConfig.stop_schedule_next_run || null;
    const displayNext = effectivelyEnabled
      ? formatDate(serverNext || computeDeviceNextRun(sanitized))
      : null;
    nextEl.textContent = displayNext || "--";
  }
  if (lastEl) {
    const serverLast = state.globalConfig.stop_schedule_last_run || null;
    lastEl.textContent = serverLast ? (formatScheduleDate(serverLast) || "--") : "--";
  }
  if (hintEl) {
    hintEl.classList.toggle("error", Boolean(state.globalScheduleError));
    if (state.globalScheduleError) {
      hintEl.textContent = state.globalScheduleError;
    } else if (!sanitized) {
      hintEl.textContent = "HH:MM 형식으로 입력하세요.";
    } else if (!toggleChecked) {
      hintEl.textContent = `저장된 시간 ${sanitized} · 토글을 켜면 적용됩니다.`;
    } else {
      hintEl.textContent = `${sanitized}에 자동 중지가 실행됩니다.`;
    }
  }
}

function normalizeGlobalFieldValue(field, value) {
  if (field === "active_domain") {
    return sanitizeGlobalDomain(value ?? GLOBAL_DEFAULTS.active_domain);
  }
  if (field === "session_count") {
    return sanitizeSessionValue(value ?? "");
  }
  if (field === "bcc_count") {
    return sanitizeBccValue(value ?? "");
  }
  if (field === "stop_schedule_enabled") {
    return Boolean(value);
  }
  if (field === "stop_schedule_time") {
    return sanitizeScheduleTime(value ?? "");
  }
  if (value === undefined || value === null) {
    return GLOBAL_DEFAULTS[field];
  }
  return String(value);
}

function normalizeGlobalConfig(config) {
  const normalized = {};
  GLOBAL_FIELD_LIST.forEach((field) => {
    normalized[field] = normalizeGlobalFieldValue(field, config?.[field]);
  });
  normalized.updated_at = config?.updated_at || null;
  normalized.stop_schedule_last_run = config?.stop_schedule_last_run || null;
  normalized.stop_schedule_next_run = config?.stop_schedule_next_run || null;
  return normalized;
}

function syncGlobalInputsFromDraft(options = {}) {
  const { force = false } = options;
  GLOBAL_FIELD_LIST.forEach((field) => {
    if (!force && state.globalDirty[field]) {
      return;
    }
     if (field === "active_domain") {
       const normalizedDomain = normalizeGlobalFieldValue(field, state.globalDraft[field]);
       state.globalDraft[field] = normalizedDomain;
       const radios = document.querySelectorAll('input[name="globalActiveDomain"]');
       if (!radios.length) {
         return;
       }
       radios.forEach((radio) => {
         radio.checked = radio.value === normalizedDomain;
       });
       return;
     }
    const input = document.getElementById(GLOBAL_INPUT_IDS[field]);
    if (!input) {
      return;
    }
    const normalizedValue = normalizeGlobalFieldValue(field, state.globalDraft[field]);
    state.globalDraft[field] = normalizedValue;
    if (input.type === "checkbox") {
      if (force || document.activeElement !== input) {
        input.checked = Boolean(normalizedValue);
      }
    } else if (force || document.activeElement !== input) {
      input.value = normalizedValue;
    }
  });
  updateGlobalScheduleUI();
}

function applyValuesToGlobalDraft(values, options = {}) {
  const { markDirty = true, force = true } = options;
  if (!values) {
    return;
  }
  Object.entries(values).forEach(([field, value]) => {
    if (!GLOBAL_FIELD_LIST.includes(field)) {
      return;
    }
    const normalized = normalizeGlobalFieldValue(field, value);
    state.globalDraft[field] = normalized;
    state.globalDirty[field] = markDirty;
  });
  if (force) {
    syncGlobalInputsFromDraft({ force: true });
  }
  updateGlobalScheduleUI();
}

function initGlobalForm() {
  GLOBAL_FIELD_LIST.forEach((field) => {
    if (field === "active_domain") {
      const radios = document.querySelectorAll('input[name="globalActiveDomain"]');
      if (!radios.length) {
        return;
      }
      radios.forEach((radio) => {
        radio.addEventListener("change", () => {
          if (!radio.checked) {
            return;
          }
          const sanitized = sanitizeGlobalDomain(radio.value);
          state.globalDirty.active_domain = true;
          state.globalDraft.active_domain = sanitized;
        });
      });
      return;
    }
    const input = document.getElementById(GLOBAL_INPUT_IDS[field]);
    if (!input) return;
    if (field === "stop_schedule_enabled") {
      input.addEventListener("change", () => {
        state.globalDirty[field] = true;
        state.globalDraft[field] = input.checked;
        if (!input.checked) {
          state.globalScheduleError = "";
        }
        updateGlobalScheduleUI({ error: null });
      });
      return;
    }
    if (field === "stop_schedule_time") {
      input.addEventListener("input", () => {
        const formatted = formatScheduleInputValue(input.value);
        if (input.value !== formatted) {
          input.value = formatted;
        }
        state.globalDirty[field] = true;
        state.globalDraft[field] = input.value;
        updateGlobalScheduleUI({ error: null });
      });
      input.addEventListener("blur", () => {
        const formatted = formatScheduleInputValue(input.value);
        if (input.value !== formatted) {
          input.value = formatted;
        }
        state.globalDraft[field] = input.value;
        state.globalDirty[field] = true;
        updateGlobalScheduleUI({ error: null });
      });
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          input.blur();
        }
      });
      return;
    }
    input.addEventListener("input", () => {
      state.globalDirty[field] = true;
      state.globalDraft[field] = input.value;
    });
    if (field === "session_count") {
      input.addEventListener("blur", () => {
        const sanitized = sanitizeSessionValue(input.value);
        if (input.value !== sanitized) {
          input.value = sanitized;
        }
        state.globalDraft[field] = sanitized;
        state.globalDirty[field] = true;
      });
    } else if (field === "bcc_count") {
      input.addEventListener("blur", () => {
        const sanitized = sanitizeBccValue(input.value);
        if (input.value !== sanitized) {
          input.value = sanitized;
        }
        state.globalDraft[field] = sanitized;
        state.globalDirty[field] = true;
      });
    }
  });
  updateGlobalScheduleUI({ error: null });
}

function parseSendLogPayload(payload) {
  if (!payload || typeof payload !== "string") {
    return null;
  }
  const parts = payload.split("|");
  if (parts.length < 3) {
    return null;
  }
  const rawLabel = parts[0] ?? "";
  const rawCount = parts[1] ?? "";
  const rawEmail = parts[2] ?? "";
  let timestamp = null;
  let metaStartIndex = 3;
  if (parts.length >= 4) {
    const candidate = (parts[3] ?? "").trim();
    if (candidate && !candidate.includes("=")) {
      timestamp = candidate;
      metaStartIndex = 4;
    } else {
      metaStartIndex = 3;
    }
  }
  const meta = {};
  for (let i = metaStartIndex; i < parts.length; i += 1) {
    const segment = parts[i];
    if (!segment) continue;
    const [key, value] = segment.split("=", 2);
    if (!key) continue;
    const normalizedKey = key.trim().toLowerCase();
    if (!normalizedKey) continue;
    meta[normalizedKey] = (value ?? "").trim();
  }
  const label = (rawLabel || "").trim();
  const email = (rawEmail || "").trim();
  const countValue = parseInt((rawCount || "").trim(), 10);
  const count = Number.isNaN(countValue) ? null : countValue;
  const primaryFlag = meta.primary ?? null;
  const isPrimary = typeof primaryFlag === "string"
    ? ["1", "true", "yes"].includes(primaryFlag.toLowerCase())
    : false;
  let bccCount = null;
  if (typeof meta.bcc === "string" && meta.bcc) {
    const parsedBcc = parseInt(meta.bcc, 10);
    if (!Number.isNaN(parsedBcc) && parsedBcc > 0) {
      bccCount = parsedBcc;
    }
  }
  let anchorCount = null;
  if (typeof meta.anchor === "string" && meta.anchor) {
    const parsedAnchor = parseInt(meta.anchor, 10);
    if (!Number.isNaN(parsedAnchor) && parsedAnchor > 0) {
      anchorCount = parsedAnchor;
    }
  }
  return { label, email, count, timestamp, meta, isPrimary, bccCount, anchorCount };
}

function buildLogDisplayText(entry) {
  const parsed = parseSendLogPayload(entry?.response);
  if (!parsed || !parsed.label || !parsed.email) {
    return entry?.response || entry?.log || "-";
  }
  const baseLabel = parsed.label.trim();
  let labelText = baseLabel;
  if (baseLabel && baseLabel.toLowerCase() === "sent" && typeof parsed.count === "number" && parsed.count > 0) {
    labelText = `Sent(${formatCount(parsed.count)})`;
  }
  let suffix = "";
  if (parsed.isPrimary) {
    if (typeof parsed.bccCount === "number" && parsed.bccCount > 0) {
      suffix += ` 외 ${parsed.bccCount}`;
    }
    if (typeof parsed.anchorCount === "number" && parsed.anchorCount > 0) {
      suffix += ` + 알박기 ${parsed.anchorCount}`;
    }
  }
  return `${labelText} - ${parsed.email}${suffix}`;
}

function latestChangeIpJob(device) {

  const candidates = device.jobs.filter((job) => job.job_type === "change_ip");
  if (!candidates.length) {
    return null;
  }
  return [...candidates].sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0))[0];
}

function latestSingleJob(device, domain) {
  if (!device?.jobs?.length) {
    return null;
  }
  const targetDomain = normalizeDeviceDomain(domain || device.active_domain || "naver");
  const candidates = device.jobs.filter((job) => {
    if (job.job_type !== "single_send") {
      return false;
    }
    const jobDomain = normalizeDeviceDomain(job.domain || device.active_domain || targetDomain);
    return jobDomain === targetDomain;
  });
  if (!candidates.length) {
    return null;
  }
  return [...candidates].sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0))[0];
}


function latestBatchJob(device) {
  if (!device?.jobs?.length) {
    return null;
  }
  const candidates = device.jobs.filter((job) => job.job_type === "batch_send");
  if (!candidates.length) {

  }
  return [...candidates].sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0))[0];
}

function parseSummaryNumber(value) {
  const num = Number(value);
  return Number.isFinite(num) ? num : 0;
}

function extractSummaryPayload(payload) {
  if (!payload || typeof payload !== "object") {
    return null;
  }
  if (payload.summary && typeof payload.summary === "object") {
    return extractSummaryPayload(payload.summary);
  }
  const hasExpectedField = ["processed", "sent", "failed", "bcc", "anchor"].some((key) => Object.prototype.hasOwnProperty.call(payload, key));
  return hasExpectedField ? payload : null;
}

function latestJobSummary(job) {
  if (!job) {
    return null;
  }
  const progress = Array.isArray(job.progress) ? job.progress : [];
  for (let i = progress.length - 1; i >= 0; i -= 1) {
    const candidate = extractSummaryPayload(progress[i]?.data);
    if (candidate) {
      return candidate;
    }
  }
  const resultSummary = extractSummaryPayload(job.result);
  if (resultSummary) {
    return resultSummary;
  }
  return null;
}

function hasActiveBatchJob(device) {
  if (!device?.jobs?.length) {
    return false;
  }
  return device.jobs.some((job) => job.job_type === "batch_send" && (ACTIVE_JOB_STATES.has(job.status) || (job.status === "running" && job.cancel_requested)));
}

function delay(ms) {
  return new Promise((resolve) => setTimeout(resolve, ms));
}

async function fetchJSON(url, options = {}) {
  const response = await fetch(url, {
    headers: { "Content-Type": "application/json" },
    credentials: "same-origin",
    ...options,
  });
  const contentType = response.headers.get("Content-Type") || "";
  const isJSON = contentType.includes("application/json");
  if (!response.ok) {
    const message = isJSON ? await response.json() : await response.text();
    const detail = message?.detail || message?.error || message;
    throw new Error(detail || "요청에 실패했습니다.");
  }
  return isJSON ? response.json() : response.text();
}

async function pollJobUntilDone(jobId, options = {}) {
  const { timeout = 30000, interval = 1500 } = options;
  if (!jobId) return null;
  const started = Date.now();
  while (Date.now() - started < timeout) {
    if (!state.imapModal.open || state.imapModal.testJobId !== jobId) {
      return null;
    }
    try {
      const job = await fetchJSON(`/api/jobs/${jobId}`);
      if (job && job.status && !ACTIVE_JOB_STATES.has(job.status)) {
        return job;
      }
    } catch (err) {
      console.warn("작업 상태 조회 실패:", err);
    }
    await delay(interval);
  }
  return null;
}
