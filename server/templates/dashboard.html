}

function parseTimestampMs(value) {
  if (!value) {
    return NaN;
  }
  const ms = Date.parse(value);
  return Number.isNaN(ms) ? NaN : ms;
}

function jobIsActive(job) {
  if (!job) {
    return false;
  }
  if (job.status === "running" && job.cancel_requested) {
    return true;
  }
  return ACTIVE_JOB_STATES.has(job.status);
}

function formatElapsedDuration(ms) {
  if (!Number.isFinite(ms) || ms < 0) {
    return "-";
  }
  const totalSeconds = Math.floor(ms / 1000);
  if (totalSeconds <= 0) {
    return "<1초";
  }
  const hours = Math.floor(totalSeconds / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;
  if (hours > 0) {
    return minutes > 0 ? `${hours}시간 ${minutes}분` : `${hours}시간`;
  }
  if (minutes > 0) {
    return seconds > 0 ? `${minutes}분 ${seconds}초` : `${minutes}분`;
  }
  return `${seconds}초`;
}

function describeElapsedStatus(job) {
  if (!job) {
    return { text: "대기 중", state: "idle" };
  }
  const active = jobIsActive(job);
  const cancelRequested = Boolean(job.cancel_requested);
  const startedMs = parseTimestampMs(job.started_at);
  const queuedMs = parseTimestampMs(job.queued_at);
  const createdMs = parseTimestampMs(job.created_at);
  const hasStarted = !Number.isNaN(startedMs);
  if (!hasStarted && (!active || job.status === "pending" || job.status === "dispatched")) {
    const label = JOB_STATUS_LABELS[job.status] || job.status || "대기 중";
    return { text: label, state: job.status || "idle" };
  }
  let startMs = startedMs;
  if (Number.isNaN(startMs)) {
    startMs = Number.isNaN(queuedMs) ? createdMs : queuedMs;
  }
  if (Number.isNaN(startMs)) {
    const fallbackLabel = JOB_STATUS_LABELS[job.status] || job.status || "대기 중";
    const state = active ? (cancelRequested ? "cancelling" : "running") : (job.status || "idle");
    return { text: fallbackLabel, state };
  }
  let endMs = Date.now();
  if (!active) {
    const finishedMs = parseTimestampMs(job.finished_at);
    if (!Number.isNaN(finishedMs)) {
      endMs = finishedMs;
    }
  }
  const diffMs = Math.max(0, endMs - startMs);
  const durationText = diffMs < 1000 ? "<1초" : formatElapsedDuration(diffMs);
  let statusLabel;
  let stateLabel;
  if (active) {
    statusLabel = cancelRequested ? "중지 중" : (JOB_STATUS_LABELS[job.status] || "진행 중");
    stateLabel = cancelRequested ? "cancelling" : "running";
  } else {
    const fallback = JOB_STATUS_LABELS[job.status] || job.status || "완료";
    statusLabel = fallback;
    if (job.status === "success") {
      stateLabel = "success";
    } else if (job.status === "failed") {
      stateLabel = "failed";
    } else if (job.status === "cancelled") {
      stateLabel = "cancelled";
    } else {
      stateLabel = job.status || "idle";
    }
  }
  return {
    text: `${statusLabel} ${durationText}`,
    state: stateLabel,
  };
}

function updateSuccessCounter(card, device) {
  if (!card || !device) {
    return;
  }
  const tracker = ensureSuccessTracker(device.id);
  if (!tracker) {
    return;
  }
  const job = latestBatchJob(device);
  const jobId = job?.id || null;
  if (jobId && tracker.lastBatchId !== jobId) {
    tracker.lastBatchId = jobId;
    tracker.value = 0;
    const jobCreatedMs = parseTimestampMs(job?.created_at);
    tracker.resetCutoff = Number.isNaN(jobCreatedMs) ? Date.now() : jobCreatedMs;
  } else if (!jobId && tracker.lastBatchId === null && tracker.resetCutoff === undefined) {
    tracker.resetCutoff = null;
  }

  if (jobId && tracker.resetCutoff === null) {
    const jobCreatedMs = parseTimestampMs(job?.created_at);
    tracker.resetCutoff = Number.isNaN(jobCreatedMs) ? Date.now() : jobCreatedMs;
  }

  const summary = latestJobSummary(job);
  let summarySent = 0;
  let summaryAnchor = 0;
  if (summary) {
    summarySent = parseSummaryNumber(
      summary.sent_sequence
      ?? summary.sent_absolute
      ?? summary.sent_total
      ?? summary.total_sent
      ?? summary.sequence
      ?? summary.sent,
    );
    summaryAnchor = parseSummaryNumber(summary.anchor);
  }

  const cutoffMs = typeof tracker.resetCutoff === "number" && !Number.isNaN(tracker.resetCutoff)
    ? tracker.resetCutoff
    : null;

  let maxCount = 0;
  let anchorFromLogs = 0;
  (device.logs || []).forEach((entry) => {
    if (!entry?.success) {
      return;
    }
    if (cutoffMs !== null) {
      const entryMs = parseTimestampMs(entry.created_at);
      if (!Number.isNaN(entryMs) && entryMs < cutoffMs) {
        return;
      }
    }
    const parsed = parseSendLogPayload(entry.response);
    if (!parsed || typeof parsed.count !== "number") {
      return;
    }
    let candidate = parsed.count;
    if (parsed.isPrimary && typeof parsed.bccCount === "number" && parsed.bccCount > 0) {
      candidate = parsed.count + parsed.bccCount;
    }
    if (parsed.isPrimary && typeof parsed.anchorCount === "number" && parsed.anchorCount > 0) {
      anchorFromLogs += parsed.anchorCount;
    }
    if (candidate > maxCount) {
      maxCount = candidate;
    }
  });

  const sentTotal = Math.max(summarySent, maxCount);
  const anchorTotal = Math.max(summaryAnchor, anchorFromLogs);

  tracker.value = sentTotal;
  tracker.anchor = anchorTotal;
  const counterEl = card.querySelector('[data-role="successCounter"]');
  if (counterEl) {
    counterEl.textContent = `누적 성공: ${formatCount(sentTotal)}건`;
  }
  const elapsedEl = card.querySelector('[data-role="elapsedCounter"]');
  if (elapsedEl) {
    const elapsed = describeElapsedStatus(job);
    elapsedEl.textContent = `경과: ${elapsed.text} · 알박기: ${formatCount(anchorTotal)}건`;
    if (elapsed.state) {
      elapsedEl.dataset.state = elapsed.state;
    } else {
      delete elapsedEl.dataset.state;
    }
  }
}

function setNotice(card, message, type = "success") {
  let notice = card.querySelector(".notice");
  if (!notice) {
    notice = document.createElement("div");
    notice.className = "notice";
    card.insertBefore(notice, card.firstChild.nextSibling);
  }
  notice.textContent = message;
  notice.className = `notice ${type}`;
  setTimeout(() => {
    if (notice) {
      notice.textContent = "";
    }
  }, 3500);
}

function renderImapSection(card, device, domain) {
  const block = card.querySelector('[data-role="imapBlock"]');
  if (!block) return;
  const isNaver = domain === "naver";
  block.classList.toggle("hidden", !isNaver);
  if (!isNaver) {
    block.dataset.imapUsername = "";
    block.dataset.imapDelay = String(IMAP_DEFAULT_DELAY);
    block.dataset.imapPasswordSaved = "0";
    const anchorMetaEl = block.querySelector('[data-role="imapAnchorMeta"]');
    if (anchorMetaEl) {
      anchorMetaEl.textContent = "알박기 확인: 사용 안 함";
      anchorMetaEl.title = "네이버 도메인에서만 알박기 도착 확인을 제공합니다.";
    }
    return;
  }
  const config = bestConfig(device, domain);
  const toggle = block.querySelector('[data-field="imap_enabled"]');
  if (toggle) {
    toggle.checked = Boolean(config.imap_enabled);
  }
  const statusEl = block.querySelector('[data-role="imapStatus"]');
  const metaEl = block.querySelector('[data-role="imapMeta"]');
  const anchorMetaEl = block.querySelector('[data-role="imapAnchorMeta"]');
  let statusClass = "off";
  let statusText = "IMAP 확인 비활성";
  let metaText = "네이버 도메인에서 계정을 설정하면 도착 여부를 자동으로 확인합니다.";
  if (config.imap_enabled) {
    const lastStatus = config.imap_last_status || "";
    const checkedAt = config.imap_last_checked_at;
    const receivedAt = config.imap_last_received_at || checkedAt;
    const latencyValue = Number(config.imap_last_latency);
    const reasonText = config.imap_last_error || "";
    statusClass = "warning";
    statusText = "IMAP 확인 대기 중";
    if (lastStatus === "success") {
      statusClass = "success";
      statusText = "최근 확인 성공";
      const latencyText = Number.isFinite(latencyValue) ? `${latencyValue.toFixed(1)}초` : "-";
      metaText = `${receivedAt ? `도착: ${formatDate(receivedAt)}` : "최근 확인"} · 지연 ${latencyText}`;
    } else if (lastStatus === "failure") {
      statusClass = "error";
      statusText = "최근 확인 실패";
      metaText = `${checkedAt ? formatDate(checkedAt) : "최근 확인"} · ${reasonText || "허용 지연 초과"}`;
    } else if (lastStatus === "error") {
      statusClass = "error";
      statusText = "IMAP 확인 오류";
      metaText = reasonText || "IMAP 확인 중 오류가 발생했습니다.";
    } else if (checkedAt) {
      metaText = `최근 확인: ${formatDate(checkedAt)}`;
    } else {
      metaText = "발송 후 자동으로 도착 여부를 확인합니다.";
    }
  }
  statusEl.textContent = statusText;
  statusEl.className = `imap-status ${statusClass}`;
  metaEl.textContent = metaText;
  const imapDelayValue = clampNumber(
    config.imap_delay_seconds ?? IMAP_DEFAULT_DELAY,
    IMAP_MIN_DELAY,
    IMAP_MAX_DELAY,
    IMAP_DEFAULT_DELAY,
  );
  if (anchorMetaEl) {
    if (!config.imap_enabled) {
      anchorMetaEl.textContent = "알박기 확인: IMAP 비활성";
    } else {
      anchorMetaEl.textContent = `알박기 확인: 허용 지연 ${imapDelayValue}초 기준 자동 검사`;
    }
    anchorMetaEl.title = "허용 지연 시간으로 단일 발송과 알박기 메일 모두를 확인하며, 내부적으로 필요한 만큼 자동으로 대기합니다.";
  }
  block.dataset.imapUsername = config.imap_username || "";
  block.dataset.imapDelay = String(imapDelayValue);
  block.dataset.imapPasswordSaved = config.imap_password_saved ? "1" : "0";
}

function populateConfigForm(card, device, domain) {
  const config = bestConfig(device, domain);
  const cache = ensureFieldCache(device.id, domain, config);
  card.dataset.activeDomain = domain;
  renderDomainSummary(card, device, domain);
  const heloInput = card.querySelector('[data-field="helo"]');
  if (heloInput && document.activeElement !== heloInput) heloInput.value = cache.values.helo;
  const mailInput = card.querySelector('[data-field="mail_from"]');
  if (mailInput && document.activeElement !== mailInput) mailInput.value = cache.values.mail_from;
  const headerInput = card.querySelector('[data-field="header"]');
  if (headerInput && document.activeElement !== headerInput) headerInput.value = cache.values.header;
  const sessionInput = card.querySelector('[data-field="session_count"]');
  if (sessionInput && document.activeElement !== sessionInput) sessionInput.value = cache.values.session_count;
  const bccInput = card.querySelector('[data-field="bcc_count"]');
  if (bccInput && document.activeElement !== bccInput) bccInput.value = cache.values.bcc_count;
  const anchorIntervalInput = card.querySelector('[data-field="anchor_interval"]');
  if (anchorIntervalInput && document.activeElement !== anchorIntervalInput) anchorIntervalInput.value = cache.values.anchor_interval;
  const anchorEmailInput = card.querySelector('[data-field="anchor_email"]');
  if (anchorEmailInput && document.activeElement !== anchorEmailInput) anchorEmailInput.value = cache.values.anchor_email;
  const rcptInput = card.querySelector('[data-field="rcpt_to"]');
  if (rcptInput && document.activeElement !== rcptInput) rcptInput.value = cache.values.rcpt_to;
  updateDeviceSchedule(card, device, domain, config);
  renderImapSection(card, device, domain);
}

function attachCardEvents(card) {
  const getDevice = () => {
    if (card.__deviceData) {
      return card.__deviceData;
    }
    const name = card.querySelector('[data-role="deviceName"]')?.textContent || card.dataset.deviceId;
    return { id: card.dataset.deviceId, active_domain: "naver", name, configs: {} };
  };

  const changeIpBtn = card.querySelector('button[data-action="change-ip"]');
  if (changeIpBtn) {
    changeIpBtn.addEventListener("click", async () => {
      const currentDevice = getDevice();
      if (!currentDevice?.id) {
        return;
      }
      const originalText = changeIpBtn.textContent;
      changeIpBtn.disabled = true;
      changeIpBtn.textContent = "IP 변경 중...";
      try {
        await fetchJSON(`/api/devices/${currentDevice.id}/actions/change-ip`, { method: "POST" });
        setNotice(card, "IP 변경 작업을 요청했습니다.");
        await loadDevices({ silent: true });
      } catch (err) {
        changeIpBtn.disabled = false;
        changeIpBtn.textContent = originalText || "IP 변경";
        setNotice(card, err.message || "IP 변경 요청에 실패했습니다.", "error");
      }
    });
  }

  const deleteBtn = card.querySelector('button[data-action="delete-device"]');
  if (deleteBtn) {
    deleteBtn.addEventListener("click", async () => {
      const currentDevice = getDevice();
      if (!currentDevice?.id) {
        return;
      }
      if (!state.deviceEditMode) {
        setDeviceEditMode(true);
        return;
      }
      const confirmed = confirm(`'${currentDevice.name}' 디바이스를 삭제하시겠습니까? 관련 설정과 로그도 함께 제거됩니다.`);
      if (!confirmed) {
        return;
      }
      state.deletingDevices.add(currentDevice.id);
      updateCardDeleteButton(card, currentDevice);
      try {
        await fetchJSON(`/api/devices/${currentDevice.id}`, { method: "DELETE" });
        setGlobalStatus(`'${currentDevice.name}' 디바이스를 삭제했습니다.`, "success");
        await loadDevices({ silent: true });
      } catch (err) {
        setGlobalStatus(err.message || "디바이스 삭제에 실패했습니다.", "error");
      } finally {
        state.deletingDevices.delete(currentDevice.id);
        updateCardDeleteButton(card, currentDevice);
      }
    });
  }

  card.querySelectorAll('[data-role="domainRadio"]').forEach((radio) => {
    radio.addEventListener("change", async (evt) => {
      if (!evt.target.checked) return;
      const currentDevice = getDevice();
      const domain = evt.target.value;
      try {
        await fetchJSON(`/api/devices/${currentDevice.id}/active-domain`, {
          method: "POST",
          body: JSON.stringify({ domain }),
        });
        currentDevice.active_domain = domain;
        card.__deviceData = { ...currentDevice };
        populateConfigForm(card, currentDevice, domain);
        updateSingleSendControls(card, card.__deviceData);
        setNotice(card, `${DOMAIN_LABELS[domain]} 도메인으로 전환했습니다.`);
      } catch (err) {
        setNotice(card, err.message || "도메인 전환에 실패했습니다.", "error");
      }
    });
  });

  const imapToggle = card.querySelector('[data-field="imap_enabled"]');
  if (imapToggle) {
    imapToggle.addEventListener("change", async (evt) => {
      const toggledOn = evt.target.checked;
      const currentDevice = getDevice();
      const domain = getActiveDomain(card, currentDevice.active_domain);
      if (domain !== "naver") {
        evt.target.checked = false;
        setNotice(card, "네이버 도메인을 선택하면 IMAP 확인을 사용할 수 있습니다.", "error");
        return;
      }
      if (toggledOn) {
        evt.target.checked = false;
        openImapModal(card, currentDevice, domain, { forceEnable: true });
        return;
      }
      evt.target.disabled = true;
      try {
        await fetchJSON(`/api/devices/${currentDevice.id}/domains/${domain}/imap`, {
          method: "POST",
          body: JSON.stringify({ enabled: false }),
        });
        setNotice(card, "IMAP 확인을 비활성화했습니다.");
        await loadDevices({ silent: true });
      } catch (err) {
        evt.target.checked = true;
        setNotice(card, err.message || "IMAP 비활성화를 처리하지 못했습니다.", "error");
      } finally {
        evt.target.disabled = false;
      }
    });
  }

  const imapSettingsBtn = card.querySelector('[data-action="imap-settings"]');
  if (imapSettingsBtn) {
    imapSettingsBtn.addEventListener("click", () => {
      const currentDevice = getDevice();
      const domain = getActiveDomain(card, currentDevice.active_domain);
      if (domain !== "naver") {
        setNotice(card, "네이버 도메인을 선택하면 IMAP 설정을 변경할 수 있습니다.", "error");
        return;
      }
      openImapModal(card, currentDevice, domain, { forceEnable: false });
    });
  }

  CONFIG_FIELDS.forEach((fieldName) => {
    const el = card.querySelector(`[data-field="${fieldName}"]`);
    if (!el) {
      return;
    }
    el.addEventListener("input", (event) => {
      const currentDevice = getDevice();
      const domain = getActiveDomain(card, currentDevice.active_domain);
      markFieldDirty(currentDevice.id, domain, fieldName, event.target.value);
    });
  });

  const sessionInput = card.querySelector('[data-field="session_count"]');
  if (sessionInput) {
    sessionInput.addEventListener("blur", () => {
      const sanitized = sanitizeSessionValue(sessionInput.value);
      if (sessionInput.value !== sanitized) {
        sessionInput.value = sanitized;
      }
      const currentDevice = getDevice();
      const domain = getActiveDomain(card, currentDevice.active_domain);
      markFieldDirty(currentDevice.id, domain, "session_count", sanitized);
    });
  }

  const bccInput = card.querySelector('[data-field="bcc_count"]');
  if (bccInput) {
    bccInput.addEventListener("blur", () => {
      const sanitized = sanitizeBccValue(bccInput.value);
      if (bccInput.value !== sanitized) {
        bccInput.value = sanitized;
      }
      const currentDevice = getDevice();
      const domain = getActiveDomain(card, currentDevice.active_domain);
      markFieldDirty(currentDevice.id, domain, "bcc_count", sanitized);
    });
  }

  const anchorIntervalInput = card.querySelector('[data-field="anchor_interval"]');
  if (anchorIntervalInput) {
    anchorIntervalInput.addEventListener("blur", () => {
      const sanitized = sanitizeAnchorValue(anchorIntervalInput.value);
      if (anchorIntervalInput.value !== sanitized) {
        anchorIntervalInput.value = sanitized;
      }
      const currentDevice = getDevice();
      const domain = getActiveDomain(card, currentDevice.active_domain);
      markFieldDirty(currentDevice.id, domain, "anchor_interval", sanitized);
    });
  }

  const scheduleToggle = card.querySelector('[data-field="stop_schedule_enabled"]');
  const scheduleTimeInput = card.querySelector('[data-field="stop_schedule_time"]');

  if (scheduleTimeInput) {
    const commitTimeChange = async () => {
      const formatted = formatScheduleInputValue(scheduleTimeInput.value);
      if (scheduleTimeInput.value !== formatted) {
        scheduleTimeInput.value = formatted;
      }
      const sanitized = sanitizeScheduleTime(scheduleTimeInput.value);
      const currentDevice = getDevice();
      const domain = getActiveDomain(card, currentDevice.active_domain);
      const config = bestConfig(currentDevice, domain);
      const wantsEnable = Boolean(scheduleToggle?.checked);
      const storedTime = sanitizeScheduleTime(config?.stop_schedule_time) || "";

      if (!sanitized && scheduleTimeInput.value.trim() !== "") {
        scheduleTimeInput.value = storedTime;
        setNotice(card, "24시간 형식(HH:MM)으로 입력하세요.", "error");
        updateDeviceSchedule(card, currentDevice, domain, config);
        return;
      }

      if (sanitized === storedTime && wantsEnable === Boolean(config?.stop_schedule_enabled)) {
        updateDeviceSchedule(card, currentDevice, domain, config);
        return;
      }

      if (wantsEnable && !sanitized) {
        scheduleTimeInput.value = storedTime;
        if (scheduleToggle) {
          scheduleToggle.checked = Boolean(config?.stop_schedule_enabled);
        }
        setNotice(card, "예약을 켜려면 HH:MM 형식의 시간을 입력하세요.", "error");
        updateDeviceSchedule(card, currentDevice, domain, config);
        return;
      }

      try {
        await requestDeviceScheduleUpdate(card, currentDevice, domain, {
          enabled: wantsEnable && Boolean(sanitized),
          time: sanitized,
        });
      } catch (err) {
        // 오류 메시지는 requestDeviceScheduleUpdate 내부에서 처리됩니다.
      }
    };

    scheduleTimeInput.addEventListener("input", () => {
      const formatted = formatScheduleInputValue(scheduleTimeInput.value);
      if (scheduleTimeInput.value !== formatted) {
        scheduleTimeInput.value = formatted;
      }
    });
    scheduleTimeInput.addEventListener("blur", commitTimeChange);
    scheduleTimeInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        commitTimeChange();
      }
    });
  }

  if (scheduleToggle) {
    scheduleToggle.addEventListener("change", async () => {
      const currentDevice = getDevice();
      const domain = getActiveDomain(card, currentDevice.active_domain);
      const config = bestConfig(currentDevice, domain);
      const timeInput = card.querySelector('[data-field="stop_schedule_time"]');
      const formatted = formatScheduleInputValue(timeInput?.value ?? "");
      if (timeInput && timeInput.value !== formatted) {
        timeInput.value = formatted;
      }
      const sanitized = sanitizeScheduleTime(formatted);
      let timeForRequest = sanitized || sanitizeScheduleTime(config?.stop_schedule_time) || "";
      const wantsEnable = Boolean(scheduleToggle.checked);

      if (wantsEnable && !timeForRequest) {
        scheduleToggle.checked = Boolean(config?.stop_schedule_enabled);
        if (timeInput) {
          timeInput.value = sanitizeScheduleTime(config?.stop_schedule_time) || "";
        }
        setNotice(card, "예약을 켜려면 HH:MM 형식의 시간을 입력하세요.", "error");
        updateDeviceSchedule(card, currentDevice, domain, config);
        return;
      }

      try {
        await requestDeviceScheduleUpdate(card, currentDevice, domain, {
          enabled: wantsEnable,
          time: wantsEnable ? timeForRequest : sanitized,
        });
      } catch (err) {
        // 이미 처리됨
      }
    });
  }

  const saveBtn = card.querySelector('button[data-action="save"]');
  saveBtn.addEventListener("click", async () => {
    const currentDevice = getDevice();
    const domain = card.querySelector(`input[name="domain-${currentDevice.id}"]:checked`)?.value || currentDevice.active_domain || "naver";
    try {
      await saveConfig(card, currentDevice, domain);
      setNotice(card, "설정을 저장했습니다.");
    } catch (err) {
      setNotice(card, err.message || "설정 저장에 실패했습니다.", "error");
    }
  });

  const copyGlobalBtn = card.querySelector('button[data-action="copy-global"]');
  if (copyGlobalBtn) {
    copyGlobalBtn.addEventListener("click", () => {
      const currentDevice = getDevice();
      const domain = card.querySelector(`input[name="domain-${currentDevice.id}"]:checked`)?.value || currentDevice.active_domain || "naver";
      const { payload } = collectConfigPayload(card, currentDevice, domain);
      applyValuesToGlobalDraft({
        helo: payload.helo,
        mail_from: payload.mail_from,
        header: payload.header,
        session_count: payload.session_count,
        bcc_count: payload.bcc_count,
      });
      setGlobalStatus("선택한 카드의 설정을 전체 설정 폼에 채웠습니다. 적용 버튼을 눌러 반영하세요.", "info");
    });
  }

  const singleBtn = card.querySelector('button[data-action="single"]');
  singleBtn.addEventListener("click", async () => {
    if (singleBtn.disabled) return;
    if (!singleBtn.dataset.defaultLabel) {
      singleBtn.dataset.defaultLabel = singleBtn.textContent;
    }

    const resetButton = () => {
      singleBtn.disabled = false;
      singleBtn.classList.remove("is-loading", "is-running");
      singleBtn.textContent = singleBtn.dataset.defaultLabel || "단일 발송";
      card.dataset.currentSingleJobId = "";
      if (card.dataset.activeDomain) {
        card.dataset.currentSingleJobDomain = normalizeDeviceDomain(card.dataset.activeDomain);
      }
    };

    singleBtn.disabled = true;
    singleBtn.classList.add("is-loading", "is-running");
    singleBtn.textContent = "단일 발송 중...";

    const currentDevice = getDevice();
    const domain = card.querySelector(`input[name="domain-${currentDevice.id}"]:checked`)?.value || currentDevice.active_domain || "naver";
    const rcpt = card.querySelector('[data-field="rcpt_to"]').value.trim();
    let jobScheduled = false;

    try {
      try {
        await ensureConfigSynced(card, currentDevice, domain);
      } catch (err) {
        setNotice(card, err.message || "설정 저장에 실패했습니다.", "error");
        resetButton();
        return;
      }

      const payload = { domain, rcpt_to: rcpt || null };
      try {
        const result = await fetchJSON(`/api/devices/${currentDevice.id}/actions/send-single`, {
          method: "POST",
          body: JSON.stringify(payload),
        });
        jobScheduled = true;
        const scheduledJob = result?.job;
        if (scheduledJob) {
          const baseDevice = card.__deviceData || currentDevice || {};
          const jobs = Array.isArray(baseDevice.jobs) ? [...baseDevice.jobs] : [];
          const existingIdx = jobs.findIndex((job) => job?.id === scheduledJob.id);
          const normalizedJob = {
            ...scheduledJob,
            job_type: scheduledJob.job_type || "single_send",
            status: scheduledJob.status || "pending",
            progress: Array.isArray(scheduledJob.progress) ? scheduledJob.progress : [],
            cancel_requested: Boolean(scheduledJob.cancel_requested),
          };
          if (existingIdx >= 0) {
            jobs[existingIdx] = { ...jobs[existingIdx], ...normalizedJob };
          } else {
            jobs.unshift(normalizedJob);
          }
          const updatedDevice = { ...baseDevice, jobs };
          card.__deviceData = updatedDevice;
          updateSingleSendControls(card, updatedDevice);
        } else {
          updateSingleSendControls(card, card.__deviceData || currentDevice);
        }
        setNotice(card, "단일 발송 작업을 추가했습니다.");
        try {
          await loadDevices();
        } catch (refreshErr) {
          console.error(refreshErr);
        }
      } catch (err) {
        setNotice(card, err.message || "단일 발송 예약에 실패했습니다.", "error");
        resetButton();
        return;
      }
    } finally {
      if (!singleBtn.isConnected) {
        return;
      }
      singleBtn.classList.remove("is-loading");
      if (jobScheduled) {
        updateSingleSendControls(card, card.__deviceData || currentDevice);
      }
    }
  });

  const batchBtn = card.querySelector('button[data-action="batch"]');
  batchBtn.addEventListener("click", async () => {
    const currentDevice = getDevice();
    const domain = card.querySelector(`input[name="domain-${currentDevice.id}"]:checked`)?.value || currentDevice.active_domain || "naver";
    try {
      await ensureConfigSynced(card, currentDevice, domain);
    } catch (err) {
      setNotice(card, err.message || "설정 저장에 실패했습니다.", "error");
      return;
    }
    try {
      await fetchJSON(`/api/devices/${currentDevice.id}/actions/send-batch`, {
        method: "POST",
        body: JSON.stringify({ domain }),
      });
      setNotice(card, "전체 발송 작업을 추가했습니다.");
      await loadDevices();
    } catch (err) {
      setNotice(card, err.message || "전체 발송 예약에 실패했습니다.", "error");
    }
  });

  const fileButtons = card.querySelectorAll('button[data-action="files"]');
  fileButtons.forEach((btn) => {
    btn.addEventListener("click", () => {
      const currentDevice = getDevice();
      const domain = btn.dataset.domain;
      openFileModal(currentDevice, domain);
    });
  });

  const clearBtn = card.querySelector('button[data-action="clear-logs"]');
  if (clearBtn) {
    clearBtn.addEventListener("click", async () => {
      const currentDevice = getDevice();
      if (!currentDevice?.id) return;
      clearBtn.disabled = true;
      const activeDomain = getActiveDomain(card, currentDevice.active_domain);
      try {
        await fetchJSON(`/api/devices/${currentDevice.id}/logs/clear`, {
          method: "POST",
          body: JSON.stringify({ domain: activeDomain }),
        });
        const listEl = card.querySelector('[data-role="logList"]');
        if (listEl) {
          listEl.innerHTML = '<div class="meta">발송 로그가 없습니다.</div>';
        }
        if (card.__deviceData) {
          card.__deviceData.logs = [];
        }
        setNotice(card, "로그를 삭제했습니다.");
        await loadDevices();
      } catch (err) {
        clearBtn.disabled = false;
        setNotice(card, err.message || "로그 삭제에 실패했습니다.", "error");
      }
    });
  }

  const cancelBtn = card.querySelector('button[data-action="cancel-batch"]');
  if (cancelBtn) {
    cancelBtn.addEventListener("click", async () => {
      const currentDevice = getDevice();
      const jobId = card.dataset.currentBatchJobId;
      if (!currentDevice?.id || !jobId) {
        return;
      }
      cancelBtn.disabled = true;
      const originalText = cancelBtn.textContent;
      cancelBtn.textContent = "중지 요청 중...";
      try {
        await fetchJSON(`/api/jobs/${jobId}/cancel`, {
          method: "POST",
          body: JSON.stringify({ device_id: currentDevice.id }),
        });
        setNotice(card, "중지 요청을 전송했습니다.");
        await loadDevices({ silent: true });
      } catch (err) {
        cancelBtn.disabled = false;
        cancelBtn.textContent = originalText || "중지";
        setNotice(card, err.message || "중지 요청에 실패했습니다.", "error");
      }
    });
  }

}

function updateDeviceCard(card, device) {
  card.__deviceData = device;
  card.dataset.deviceId = device.id;
  const isOffline = device.status === "disconnected";
  card.classList.toggle("offline", isOffline);
  const activeDomain = device.active_domain || card.dataset.activeDomain || "naver";
  card.dataset.activeDomain = activeDomain;

  const nameEl = card.querySelector('[data-role="deviceName"]');
  if (nameEl) nameEl.textContent = device.name;
  const idEl = card.querySelector('[data-role="deviceId"]');
  if (idEl) idEl.textContent = device.id;
  const lastSeenEl = card.querySelector('[data-role="lastSeen"]');
  if (lastSeenEl) lastSeenEl.textContent = `최근 연결: ${device.last_seen ? formatDate(device.last_seen) : "보고되지 않음"}`;
  const statusChip = card.querySelector('[data-role="statusChip"]');
  if (statusChip) statusChip.className = statusClass(device.status);
  const statusText = card.querySelector('[data-role="statusText"]');
  if (statusText) statusText.textContent = STATUS_LABELS[device.status] || device.status || "상태 미확인";

  card.querySelectorAll('[data-role="domainRadio"]').forEach((radio) => {
    radio.name = `domain-${device.id}`;
    radio.checked = radio.value === activeDomain;
  });

  ensureFieldCache(device.id, "naver", bestConfig(device, "naver"));
  ensureFieldCache(device.id, "daum", bestConfig(device, "daum"));
  populateConfigForm(card, device, activeDomain);
  updateIpControls(card, device);
  updateSingleSendControls(card, device);

  const logListEl = card.querySelector('[data-role="logList"]');
  if (logListEl) renderLogList(device, logListEl);
  updateSuccessCounter(card, device);
  updateBatchControls(card, device);
}

function renderDevices() {
  const container = document.getElementById("deviceContainer");
  const emptyHint = document.getElementById("emptyHint");
  const seenIds = new Set();

  if (emptyHint && !emptyHint.dataset.defaultMessage) {
    emptyHint.dataset.defaultMessage = emptyHint.textContent;
  }

  const filterOnlineOnly = Boolean(state.filterOnlineOnly && !state.deviceEditMode);
  let visibleCards = 0;

  state.devices.forEach((device) => {
    let card = cardRegistry[device.id];
    if (!card) {
      card = buildDeviceCard(device);
      cardRegistry[device.id] = card;
      attachCardEvents(card);
    }
    if (card.parentNode !== container) {
      container.appendChild(card);
    }
    updateDeviceCard(card, device);
    const shouldHide = filterOnlineOnly && device.status !== "connected";
    card.classList.toggle("online-hidden", shouldHide);
    card.classList.toggle("editing", state.deviceEditMode);
    updateCardDeleteButton(card, device);
    if (!shouldHide) {
      visibleCards += 1;
    }
    seenIds.add(device.id);
  });

  Object.keys(cardRegistry).forEach((deviceId) => {
    if (!seenIds.has(deviceId)) {
      const card = cardRegistry[deviceId];
      if (card?.parentNode) {
        card.parentNode.removeChild(card);
      }
      delete cardRegistry[deviceId];
      delete state.successCounters[deviceId];
    }
  });

  if (!emptyHint) {
    return;
  }

  if (!visibleCards) {
    const hasDevices = (state.devices || []).length > 0;
    if (hasDevices && filterOnlineOnly) {
      emptyHint.textContent = "표시할 온라인 디바이스가 없습니다. 전체 보기를 선택하면 모든 카드가 표시됩니다.";
    } else if (emptyHint.dataset.defaultMessage) {
      emptyHint.textContent = emptyHint.dataset.defaultMessage;
    }
    emptyHint.style.display = "block";
  } else {
    if (emptyHint.dataset.defaultMessage) {
      emptyHint.textContent = emptyHint.dataset.defaultMessage;
    }
    emptyHint.style.display = "none";
  }
}

async function loadDevices(options = {}) {
  const { silent = false } = options;
  if (state.pollingHandle) {
    clearTimeout(state.pollingHandle);
    state.pollingHandle = null;
  }
  try {
    const data = await fetchJSON("/api/devices", { method: "GET" });
    state.devices = data.devices || [];
    const activeIds = new Set((state.devices || []).map((device) => device.id));
    if (state.deletingDevices?.size) {
      Array.from(state.deletingDevices).forEach((deviceId) => {
        if (!activeIds.has(deviceId)) {
          state.deletingDevices.delete(deviceId);
        }
      });
    }
    updateDeviceEditButton();
    const globalConfig = data.global_config || {};
    renderGlobalConfig(globalConfig);
    renderSummary(data.counts || {});
    state.lastSync = new Date().toISOString();
    renderLastSync();
    renderDevices();
    const hasRunningBatch = (state.devices || []).some(hasActiveBatchJob);
    scheduleAutoRefresh(hasRunningBatch);
  } catch (err) {
    console.error(err);
    if (!silent) {
      setNoticeMessage(err?.message || "디바이스 목록을 불러오지 못했습니다.");
    }
    scheduleAutoRefresh(false);
  }
}

function scheduleAutoRefresh(hasActiveBatch) {
  if (state.pollingHandle) {
    clearTimeout(state.pollingHandle);
  }
  if (document.hidden) {
    state.pollingHandle = null;
    return;
  }
  const delay = hasActiveBatch ? 3000 : 5000;
  state.pollingHandle = setTimeout(() => {
    loadDevices({ silent: true });
  }, delay);
}

function setNoticeMessage(message) {
  if (!message) {
    return;
  }
  console.warn(message);
}

function initOnlineOnlyToggle() {
  const toggle = document.getElementById("onlineOnlyToggle");
  if (!toggle) return;
  toggle.checked = Boolean(state.filterOnlineOnly);
  toggle.addEventListener("change", () => {
    state.filterOnlineOnly = toggle.checked;
    persistOnlineOnlyPreference(state.filterOnlineOnly);
    renderDevices();
  });
}

function showModalMessage(message, type = "error") {
  const el = document.getElementById("modalMessage");

  if (message) {
    setTimeout(() => {
      el.textContent = "";
      el.className = "modal-message";
    }, 4000);
  }
}

  const container = document.getElementById("fileListContainer");
  container.innerHTML = '<div class="meta">파일 목록을 불러오는 중...</div>';
  try {
    const data = await fetchJSON(`/api/devices/${deviceId}/domains/${domain}/files`);
    const files = data.files || [];
    if (!files.length) {
      container.innerHTML = '<div class="meta">업로드된 파일이 없습니다.</div>';
      return;
    }
    const table = document.createElement("table");
    table.className = "file-table";
    table.innerHTML = `
      <thead>
        <tr>
          <th>파일명</th>
          <th>버전</th>
          <th>크기</th>
          <th>최근 Inject</th>
          <th>동작</th>
        </tr>
      </thead>
      <tbody></tbody>
    `;
    const tbody = table.querySelector("tbody");
    files.forEach((file) => {
      const row = document.createElement("tr");
      row.dataset.fileId = file.id;
      row.innerHTML = `
        <td>
          <div>${file.filename}</div>
          <div class="meta">업로드: ${formatDate(file.uploaded_at)}</div>
        </td>
        <td>${file.version}</td>
        <td>${(file.size / 1024).toFixed(1)} KB</td>
        <td>
          <div>${file.last_injected_status ? file.last_injected_status.toUpperCase() : "-"}</div>
          <div class="meta">${file.last_injected_at ? formatDate(file.last_injected_at) : "-"}</div>
        </td>
        <td>
          <div class="file-ops">
            <button class="secondary" data-file-action="preview">미리보기</button>
            <button class="secondary" data-file-action="download">다운로드</button>
            <button data-file-action="inject">Inject</button>
            <button class="danger" data-file-action="delete">삭제</button>
          </div>
        </td>
      `;
      tbody.appendChild(row);
    });
    container.innerHTML = "";
    container.appendChild(table);
  } catch (err) {
    container.innerHTML = '<div class="meta">파일 목록을 불러오지 못했습니다.</div>';
    showModalMessage(err.message || "파일 목록 요청 실패");

async function submitImapModal() {
  const { deviceId, domain, passwordSaved, card } = state.imapModal;
  if (!deviceId || !domain) {
    return;
  }
  const username = document.getElementById("imapUsername").value.trim();
  const passwordInput = document.getElementById("imapPassword");
  const rawPassword = passwordInput.value;
  const delayInput = document.getElementById("imapDelaySeconds");
  const delayValue = clampNumber(delayInput.value, IMAP_MIN_DELAY, IMAP_MAX_DELAY, IMAP_DEFAULT_DELAY);
  delayInput.value = delayValue;

  if (!username) {
    setImapModalMessage("네이버 계정 ID를 입력하세요.");
    return;
  }
  if (!passwordSaved && !rawPassword) {
    setImapModalMessage("비밀번호를 입력하세요.");
    return;
  }

  const payload = {
    enabled: true,
    username,
    delay_seconds: delayValue,
  };
  if (rawPassword) {
    payload.password = rawPassword;
  }

  const saveBtn = document.getElementById("imapSaveBtn");
  saveBtn.disabled = true;
  saveBtn.textContent = "저장 중...";
  setImapModalMessage("");

  try {
    await fetchJSON(`/api/devices/${deviceId}/domains/${domain}/imap`, {
      method: "POST",
      body: JSON.stringify(payload),
    });
    if (card) {
      setNotice(card, "IMAP 확인 설정을 저장했습니다.");
    }
    closeImapModal();
    await loadDevices({ silent: true });
  } catch (err) {
    saveBtn.disabled = false;
    saveBtn.textContent = "저장";
    setImapModalMessage(err.message || "IMAP 설정 저장에 실패했습니다.");
  }
}

async function submitImapTest() {
  const { deviceId, domain, passwordSaved } = state.imapModal;
  if (!deviceId || !domain) return;
  const username = document.getElementById("imapUsername").value.trim();
  const passwordInput = document.getElementById("imapPassword");
  const rawPassword = passwordInput.value;
  if (!username) {
    setImapModalMessage("네이버 계정 ID를 입력하세요.");
    return;
  }
  const useSavedPassword = !rawPassword && passwordSaved;
  if (!rawPassword && !useSavedPassword) {
    setImapModalMessage("비밀번호를 입력하거나 기존 비밀번호를 먼저 저장하세요.");
    return;
  }
  const payload = { username };
  if (rawPassword) {
    payload.password = rawPassword;
  } else if (useSavedPassword) {
    payload.use_saved_password = true;
  }
  const testBtn = document.getElementById("imapTestBtn");
  if (testBtn) {
    testBtn.disabled = true;
    testBtn.textContent = "테스트 중...";
  }
  state.imapModal.testJobId = null;
  try {
    const response = await fetchJSON(`/api/devices/${deviceId}/domains/${domain}/imap/test`, {
      method: "POST",
      body: JSON.stringify(payload),
    });
    const jobId = response?.job?.id;
    if (!jobId) {
      throw new Error("테스트 작업 ID를 받지 못했습니다.");
    }
    state.imapModal.testJobId = jobId;
    const job = await pollJobUntilDone(jobId, { timeout: 45000, interval: 1500 });
    if (!job) {
      setImapModalMessage("테스트 결과를 아직 받지 못했습니다. 잠시 후 다시 확인하세요.");
      return;
    }
    const status = (job.status || "").toLowerCase();
    const result = job.result || {};
    const reason = result.reason;
    const latency = typeof result.latency === "number" ? result.latency : null;
    const usedSaved = Boolean(result.used_saved_password);
    const folder = result.folder;
    const parts = [];
    if (folder) parts.push(`${folder} 폴더`);
    if (latency !== null) parts.push(`지연 ${latency.toFixed(1)}초`);
    if (usedSaved) parts.push("저장된 비밀번호 사용");
    let message = job.message || (status === "success" ? "IMAP 연결 성공" : "IMAP 연결 실패");
    if (status === "success" && parts.length) {
      message = `${message} (${parts.join(" · ")})`;
    } else if (status !== "success" && reason) {
      message = `${message} · ${reason}`;
    }
    setImapModalMessage(message, status === "success" ? "success" : "error");
    if (state.imapModal.card) {
      setNotice(state.imapModal.card, message, status === "success" ? "success" : "error");
    }
    await loadDevices({ silent: true });
  } catch (err) {
    setImapModalMessage(err.message || "IMAP 연결 테스트 요청에 실패했습니다.");
  } finally {
    state.imapModal.testJobId = null;
    if (testBtn) {
      testBtn.disabled = false;
      testBtn.textContent = "연결 테스트";
    }
  }
}

function toggleImapPasswordVisibility() {
  const input = document.getElementById("imapPassword");
  const toggleBtn = document.querySelector('[data-action="imap-password-toggle"]');
  if (!input || !toggleBtn) return;
  const showing = input.getAttribute("type") === "text";
  const nextType = showing ? "password" : "text";
  input.setAttribute("type", nextType);
  toggleBtn.textContent = showing ? "보기" : "숨기기";
  toggleBtn.setAttribute("aria-pressed", showing ? "false" : "true");
  input.focus({ preventScroll: true });
}
async function handleFileAction(target) {
  const action = target.dataset.fileAction;
  if (!action) return;
  const row = target.closest("tr");
  if (!row) return;
  const fileId = row.dataset.fileId;
  const { deviceId, domain } = state.modal;
  if (!deviceId || !domain) return;

  if (action === "preview") {
    try {
      const data = await fetchJSON(`/api/devices/${deviceId}/domains/${domain}/files/${fileId}/preview`);
      const previewBox = document.getElementById("previewBox");
      previewBox.textContent = data.preview?.length ? data.preview.join("\n") : "미리볼 내용이 없습니다.";
      showModalMessage("미리보기 로드 성공", "success");
    } catch (err) {
      showModalMessage(err.message || "미리보기를 불러오지 못했습니다.");
    }
  }
  if (action === "download") {
    window.open(`/api/devices/${deviceId}/domains/${domain}/files/${fileId}/download`, "_blank");
  }
  if (action === "inject") {
    try {
      await fetchJSON(`/api/devices/${deviceId}/domains/${domain}/files/${fileId}/inject`, { method: "POST" });
      showModalMessage("Inject 작업을 예약했습니다.", "success");
      await loadFileList(deviceId, domain);
      await loadDevices();
    } catch (err) {
      showModalMessage(err.message || "Inject 작업 예약 실패");
    }
  }
  if (action === "delete") {
    if (!confirm("정말 삭제하시겠습니까?")) return;
    try {
      await fetchJSON(`/api/devices/${deviceId}/domains/${domain}/files/${fileId}`, { method: "DELETE" });
      showModalMessage("파일을 삭제했습니다.", "success");
      await loadFileList(deviceId, domain);
    } catch (err) {
      showModalMessage(err.message || "파일 삭제에 실패했습니다.");
    }
  }
}

async function handleFileUpload() {
  const input = document.getElementById("fileInput");
  const file = input.files?.[0];
  if (!file) {
    showModalMessage("업로드할 파일을 선택하세요.");
    return;
  }
  const { deviceId, domain } = state.modal;
  if (!deviceId || !domain) return;
  const formData = new FormData();
  formData.append("file", file);
  try {
    const response = await fetch(`/api/devices/${deviceId}/domains/${domain}/files`, {
      method: "POST",
      body: formData,
    });
    if (!response.ok) {
      const text = await response.text();
      throw new Error(text || "업로드 실패");
    }
    showModalMessage("파일을 업로드했습니다.", "success");
    input.value = "";
    await loadFileList(deviceId, domain);
  } catch (err) {
    showModalMessage(err.message || "파일 업로드에 실패했습니다.");
  }
}

async function handleDomainPurge(button) {
  const { deviceId, domain } = state.modal;
  if (!deviceId || !domain) {
    return;
  }
  if (!confirm("정말 해당 도메인의 DB를 모두 삭제하시겠습니까?")) {
    return;
  }
  const targetButton = button;
  if (targetButton) {
    targetButton.disabled = true;
  }
  try {
    await fetchJSON(`/api/devices/${deviceId}/domains/${domain}/actions/purge`, { method: "POST" });
    showModalMessage("도메인 DB를 초기화했습니다.", "success");
    await loadDevices();
    await loadFileList(deviceId, domain);
  } catch (err) {
    showModalMessage(err.message || "DB 전체 삭제에 실패했습니다.");
  } finally {
    if (targetButton) {
      targetButton.disabled = false;
    }
  }
}

async function handleGlobalApply() {
  const applyBtn = document.getElementById("globalApplyBtn");
  const heloInput = document.getElementById("globalHelo");
  const mailInput = document.getElementById("globalMailFrom");
  const headerInput = document.getElementById("globalHeader");
  const sessionInput = document.getElementById("globalSessionCount");
  const bccInput = document.getElementById("globalBccCount");
  const activeDomainRadio = document.querySelector('input[name="globalActiveDomain"]:checked');
  const scheduleToggle = document.getElementById("globalStopScheduleToggle");
  const scheduleTimeInput = document.getElementById("globalStopScheduleTime");
  if (!applyBtn) return;

  const activeDomainValue = sanitizeGlobalDomain(
    activeDomainRadio?.value ?? state.globalDraft.active_domain ?? GLOBAL_DEFAULTS.active_domain,
  );
  if (!activeDomainRadio || activeDomainRadio.value !== activeDomainValue) {
    document.querySelectorAll('input[name="globalActiveDomain"]').forEach((radio) => {
      radio.checked = radio.value === activeDomainValue;
    });
  }

  const heloValue = heloInput?.value.trim() ?? "";
  const mailValue = mailInput?.value.trim() ?? "";
  const headerValue = headerInput?.value ?? "";
  const sessionValue = sanitizeSessionValue(sessionInput?.value ?? state.globalDraft.session_count ?? GLOBAL_DEFAULTS.session_count);
  if (sessionInput && sessionInput.value !== sessionValue) {
    sessionInput.value = sessionValue;
  }
  const bccValue = sanitizeBccValue(bccInput?.value ?? state.globalDraft.bcc_count ?? GLOBAL_DEFAULTS.bcc_count);
  if (bccInput && bccInput.value !== bccValue) {
    bccInput.value = bccValue;
  }
  const scheduleRaw = scheduleTimeInput?.value ?? state.globalDraft.stop_schedule_time ?? "";
  const formattedSchedule = formatScheduleInputValue(scheduleRaw);
  if (scheduleTimeInput && scheduleTimeInput.value !== formattedSchedule) {
    scheduleTimeInput.value = formattedSchedule;
  }
  const sanitizedSchedule = sanitizeScheduleTime(formattedSchedule);
  const toggleChecked = Boolean(scheduleToggle?.checked);
  if (formattedSchedule.trim() && !sanitizedSchedule) {
    updateGlobalScheduleUI({ error: "HH:MM 형식으로 입력하세요." });
    scheduleTimeInput?.focus();
    return;
  }
  if (toggleChecked && !sanitizedSchedule) {
    updateGlobalScheduleUI({ error: "자동 중지를 활성화하려면 HH:MM 형식의 시간을 입력하세요." });
    scheduleTimeInput?.focus();
    return;
  }

  state.globalDraft.active_domain = activeDomainValue;
  state.globalDraft.helo = heloValue;
  state.globalDraft.mail_from = mailValue;
  state.globalDraft.header = headerValue;
  state.globalDraft.session_count = sessionValue;
  state.globalDraft.bcc_count = bccValue;
  state.globalDraft.stop_schedule_time = sanitizedSchedule || "";
  state.globalDraft.stop_schedule_enabled = toggleChecked;
  state.globalDirty.stop_schedule_time = true;
  state.globalDirty.stop_schedule_enabled = true;
  updateGlobalScheduleUI({ error: null });

  const payload = {
    active_domain: activeDomainValue,
    helo: heloValue,
    mail_from: mailValue,
    header: headerValue,
    session_count: Number(sessionValue),
    bcc_count: parseBccInput(bccValue),
    stop_schedule_enabled: toggleChecked && Boolean(sanitizedSchedule),
    stop_schedule_time: sanitizedSchedule || "",
  };

  const originalText = applyBtn.textContent;
  applyBtn.disabled = true;
  applyBtn.textContent = "적용 중...";
  try {
    const result = await fetchJSON("/api/global/config/apply", {
      method: "POST",
      body: JSON.stringify(payload),
    });
    const appliedFields = Array.isArray(result.applied_fields) ? result.applied_fields : [];
    const affected = Number(result.device_count ?? 0);
    const serverConfig = { ...(result.config || {}), updated_at: result.updated_at || null };
    const scheduleState = result.schedule_state || {};
    const scheduleEnabled = Boolean(scheduleState.enabled);
    const scheduleTime = sanitizeScheduleTime(scheduleState.time) || "";

    if (!appliedFields.length || affected <= 0) {
      const summary = scheduleEnabled
        ? `자동 중지 설정이 이미 최신 상태입니다${scheduleTime ? ` (매일 ${scheduleTime})` : ""}.`
        : "변경할 값이 없어 기존 설정을 유지했습니다.";
      setGlobalStatus(summary, "info");
    } else {
      const fieldLabels = appliedFields.map((field) => {
        if (field === "active_domain") return "활성 도메인";
        if (field === "helo") return "HELO";
        if (field === "mail_from") return "MAIL FROM";
        if (field === "header") return "HEADER";
        if (field === "session_count") return "세션 수";
        if (field === "bcc_count") return "BCC 수";
        if (field === "stop_schedule") return "자동 중지";
        return field.toUpperCase();
      });
      let message = fieldLabels.length
        ? `총 ${affected}대에 ${fieldLabels.join(", ")} 값을 적용했습니다.`
        : `총 ${affected}대에 설정을 적용했습니다.`;
      const scheduleSummary = scheduleEnabled
        ? `자동 중지: 활성 (매일 ${scheduleTime || "--"})`
        : "자동 중지: 비활성";
      message = `${message} · ${scheduleSummary}`;
      setGlobalStatus(message, "success");
    }

    GLOBAL_FIELD_LIST.forEach((field) => {
      state.globalDirty[field] = false;
    });

    renderGlobalConfig(serverConfig);
    updateGlobalScheduleUI({ error: null });
    await loadDevices({ silent: true });
  } catch (err) {
    setGlobalStatus(err.message || "설정 적용에 실패했습니다.", "error");
    GLOBAL_FIELD_LIST.forEach((field) => {
      state.globalDirty[field] = false;
    });
    renderGlobalConfig(state.globalConfig);
    updateGlobalScheduleUI({ error: null });
  } finally {
    applyBtn.disabled = false;
    applyBtn.textContent = originalText;
  }
}

async function handleGlobalStopAll() {
  const stopBtn = document.getElementById("globalStopAllBtn");
  if (!stopBtn) return;
  const originalText = stopBtn.textContent;
  stopBtn.disabled = true;
  stopBtn.textContent = "중지 요청 중...";
  try {
    const result = await fetchJSON("/api/global/actions/stop", {
      method: "POST",
      body: JSON.stringify({}),
    });
    const cancelled = result.cancelled ?? 0;
    const cancelRequested = result.cancel_requested ?? 0;
    const affected = cancelled + cancelRequested;
    if (affected === 0) {
      setGlobalStatus("중지할 발송 작업이 없습니다.", "info");
    } else {
      setGlobalStatus(`즉시 중지 ${cancelled}건, 중지 요청 ${cancelRequested}건을 처리했습니다.`, "success");
    }
    await loadDevices({ silent: true });
  } catch (err) {
    setGlobalStatus(err.message || "전체 중지 요청에 실패했습니다.", "error");
  } finally {
    stopBtn.disabled = false;
    stopBtn.textContent = originalText;
  }
}
