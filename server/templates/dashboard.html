<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>메일 발송 제어 대시보드</title>
<style>
:root {
  --card-columns: 4;
  --card-gap: 12px;
  --card-min-width: 220px;

  color-scheme: light;
  --color-bg: #f1f5f9;
  --color-text: #0f172a;
  --color-heading: #1f2937;
  --color-subtext: #6b7280;
  --color-muted: #475569;
  --color-muted-soft: #64748b;
  --color-muted-strong: #1e293b;
  --color-placeholder: #94a3b8;
  --color-surface: #ffffff;
  --color-surface-subtle: #f8fafc;
  --color-surface-alt: #f9fafb;
  --color-border: #e2e8f0;
  --color-border-strong: #cbd5f5;
  --color-chip-neutral-bg: #f1f5f9;
  --color-chip-neutral-text: #475569;
  --color-chip-neutral-border: #e2e8f0;
  --color-accent: #2563eb;
  --color-accent-strong: #1d4ed8;
  --color-accent-soft: #dbeafe;
  --color-accent-text-contrast: #ffffff;
  --color-success: #047857;
  --color-success-bg: #dcfce7;
  --color-success-soft: #ecfdf5;
  --color-success-border: #bbf7d0;
  --color-danger: #b91c1c;
  --color-danger-bg: #fee2e2;
  --color-danger-border: #fca5a5;
  --color-danger-soft: #fef2f2;
  --color-danger-soft-border: #fecdd3;
  --color-danger-strong: #ef4444;
  --color-danger-intense: #dc2626;
  --color-warning: #d97706;
  --color-warning-strong: #b45309;
  --color-info: #0369a1;
  --color-modal-backdrop: rgba(15, 23, 42, 0.48);
  --color-ghost-border: #94a3b8;
  --color-ip-highlight: #2563eb;
  --shadow-elevated: rgba(15, 23, 42, 0.08);
  --shadow-success: rgba(4, 120, 87, 0.12);
  --shadow-hover: rgba(37, 99, 235, 0.2);
  --shadow-modal: rgba(15, 23, 42, 0.25);
}

:root[data-theme="light"] {
  color-scheme: light;
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --color-bg: #0b1120;
  --color-text: #e2e8f0;
  --color-heading: #f8fafc;
  --color-subtext: #94a3b8;
  --color-muted: #94a3b8;
  --color-muted-soft: #a5b4cf;
  --color-muted-strong: #cbd5f5;
  --color-placeholder: #94a3b8;
  --color-surface: #111c2f;
  --color-surface-subtle: #16243c;
  --color-surface-alt: #1b2a44;
  --color-border: rgba(148, 163, 184, 0.25);
  --color-border-strong: rgba(148, 163, 184, 0.4);
  --color-chip-neutral-bg: rgba(148, 163, 184, 0.14);
  --color-chip-neutral-text: #e2e8f0;
  --color-chip-neutral-border: rgba(148, 163, 184, 0.35);
  --color-accent: #60a5fa;
  --color-accent-strong: #93c5fd;
  --color-accent-soft: rgba(96, 165, 250, 0.18);
  --color-accent-text-contrast: #041019;
  --color-success: #34d399;
  --color-success-bg: rgba(34, 197, 94, 0.22);
  --color-success-soft: rgba(22, 101, 52, 0.4);
  --color-success-border: rgba(34, 197, 94, 0.45);
  --color-danger: #f87171;
  --color-danger-bg: rgba(248, 113, 113, 0.24);
  --color-danger-border: rgba(248, 113, 113, 0.45);
  --color-danger-soft: rgba(127, 29, 29, 0.35);
  --color-danger-soft-border: rgba(248, 113, 113, 0.38);
  --color-danger-strong: #f87171;
  --color-danger-intense: #f87171;
  --color-warning: #fbbf24;
  --color-warning-strong: #f59e0b;
  --color-info: #38bdf8;
  --color-modal-backdrop: rgba(2, 6, 23, 0.7);
  --color-ghost-border: rgba(148, 163, 184, 0.45);
  --color-ip-highlight: #93c5fd;
  --shadow-elevated: rgba(2, 6, 23, 0.55);
  --shadow-success: rgba(34, 197, 94, 0.25);
  --shadow-hover: rgba(96, 165, 250, 0.35);
  --shadow-modal: rgba(2, 6, 23, 0.6);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-theme="dark"]) {
    color-scheme: dark;
    --color-bg: #0b1120;
    --color-text: #e2e8f0;
    --color-heading: #f8fafc;
    --color-subtext: #94a3b8;
    --color-muted: #94a3b8;
    --color-muted-soft: #a5b4cf;
    --color-muted-strong: #cbd5f5;
    --color-placeholder: #94a3b8;
    --color-surface: #111c2f;
    --color-surface-subtle: #16243c;
    --color-surface-alt: #1b2a44;
    --color-border: rgba(148, 163, 184, 0.25);
    --color-border-strong: rgba(148, 163, 184, 0.4);
    --color-chip-neutral-bg: rgba(148, 163, 184, 0.14);
    --color-chip-neutral-text: #e2e8f0;
    --color-chip-neutral-border: rgba(148, 163, 184, 0.35);
    --color-accent: #60a5fa;
    --color-accent-strong: #93c5fd;
    --color-accent-soft: rgba(96, 165, 250, 0.18);
    --color-accent-text-contrast: #041019;
    --color-success: #34d399;
    --color-success-bg: rgba(34, 197, 94, 0.22);
    --color-success-soft: rgba(22, 101, 52, 0.4);
    --color-success-border: rgba(34, 197, 94, 0.45);
    --color-danger: #f87171;
    --color-danger-bg: rgba(248, 113, 113, 0.24);
    --color-danger-border: rgba(248, 113, 113, 0.45);
    --color-danger-soft: rgba(127, 29, 29, 0.35);
    --color-danger-soft-border: rgba(248, 113, 113, 0.38);
    --color-danger-strong: #f87171;
    --color-danger-intense: #f87171;
    --color-warning: #fbbf24;
    --color-warning-strong: #f59e0b;
    --color-info: #38bdf8;
    --color-modal-backdrop: rgba(2, 6, 23, 0.7);
    --color-ghost-border: rgba(148, 163, 184, 0.45);
    --color-ip-highlight: #93c5fd;
    --shadow-elevated: rgba(2, 6, 23, 0.55);
    --shadow-success: rgba(34, 197, 94, 0.25);
    --shadow-hover: rgba(96, 165, 250, 0.35);
    --shadow-modal: rgba(2, 6, 23, 0.6);
  }
}
* { box-sizing: border-box; }
body {
  font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  background: var(--color-bg);
  color: var(--color-text);
  margin: 0;
  padding: 20px;
  transition: background-color 0.24s ease, color 0.24s ease;
}
h1 {
  margin: 0;
  font-size: 28px;
  font-weight: 700;
  color: var(--color-heading);
}
h2 {
  margin: 0;
  font-size: 20px;
  font-weight: 600;
  color: var(--color-heading);
}
a { color: inherit; }
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 20px;
}
.summary {
  background: var(--color-surface);
  border-radius: 16px;
  padding: 16px 20px;
  box-shadow: 0 8px 24px var(--shadow-elevated);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 18px;
  margin-bottom: 20px;
}
.summary-metrics {
  display: flex;
  flex-wrap: wrap;
  gap: 18px;
}
.summary-actions {
  display: flex;
  gap: 10px;
  margin-left: auto;
}
.summary-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--color-heading);
}
.summary-toggle input[type="checkbox"] {
  width: 16px;
  height: 16px;
  margin: 0;
}
.summary-actions button.device-edit-active {
  background: var(--color-danger-bg);
  border-color: var(--color-danger-border);
  color: var(--color-danger);
}
.global-panel {
  background: var(--color-surface);
  border-radius: 16px;
  padding: 18px 20px;
  box-shadow: 0 8px 24px var(--shadow-elevated);
  display: flex;
  flex-direction: column;
  gap: 16px;
  margin-bottom: 20px;
}
.global-panel h2 {
  margin: 0;
  font-size: 18px;
  font-weight: 700;
}
.global-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}
.global-header .global-updated {
  font-size: 12px;
}
.global-layout {
  display: grid;
  grid-template-columns: minmax(0, 1.8fr) minmax(0, 1fr);
  gap: 20px;
  align-items: start;
}
@media (max-width: 1080px) {
  .global-layout {
    grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
  }
}
@media (max-width: 860px) {
  .global-layout {
    grid-template-columns: 1fr;
  }
}
.global-primary {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.global-secondary {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.global-primary-actions {
  display: flex;
  justify-content: flex-end;
}
.global-primary-actions .global-actions {
  width: 100%;
  justify-content: flex-end;
}
.global-form {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
  align-items: start;
}
.global-form .field {
  min-width: 0;
}
.global-form .field.compact {
  max-width: 140px;
}
.global-form .domain-field,
.global-form .header-field {
  grid-column: 1 / -1;
}
.global-form .domain-field {
  min-width: 240px;
}
.global-form textarea {
  min-height: 120px;
}
.header-field textarea {
  min-height: 220px;
}
.domain-radio-group {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
}
.domain-radio-group label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: 500;
  font-size: 14px;
}
.domain-radio-group input[type="radio"] {
  width: 16px;
  height: 16px;
}
.global-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.global-schedule {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.global-schedule-card {
  background: var(--color-surface-subtle);
  border: 1px solid var(--color-border);
  border-radius: 14px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
.global-schedule-card.active {
  border-color: var(--color-success);
  box-shadow: 0 10px 28px var(--shadow-success);
}
.schedule-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.schedule-toggle {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 600;
  color: var(--color-heading);
}
.schedule-toggle input[type="checkbox"] {
  width: 18px;
  height: 18px;
}
.schedule-status-pill {
  font-size: 12px;
  font-weight: 600;
  padding: 4px 12px;
  border-radius: 999px;
  background: var(--color-chip-neutral-bg);
  color: var(--color-muted);
}
.schedule-status-pill.active {
  background: var(--color-success-bg);
  color: var(--color-success);
}
.schedule-time-field {
  gap: 8px;
}
.schedule-time-input {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.schedule-time-input input {
  flex: 1 1 120px;
}
.schedule-time-actions {
  display: flex;
  gap: 6px;
  align-items: center;
}
.schedule-time-actions.hidden {
  display: none;
}
.schedule-input-disabled {
  background: var(--color-surface-subtle) !important;
  color: var(--color-placeholder);
}
.schedule-input-disabled::placeholder {
  color: var(--color-border-strong);
}
.schedule-status-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.schedule-status-grid .status-item {
  flex: 1 1 140px;
  background: var(--color-surface);
  border-radius: 10px;
  padding: 10px 12px;
  border: 1px solid var(--color-border);
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.schedule-status-grid .status-label {
  font-size: 11px;
  color: var(--color-muted-soft);
  font-weight: 600;
}
.schedule-status-grid .status-value {
  font-size: 14px;
  font-weight: 600;
  color: var(--color-text);
}
.field-hint {
  font-size: 12px;
  color: var(--color-muted-soft);
}
.field-hint.muted {
  color: var(--color-muted);
}
.field-error {
  font-size: 12px;
  color: var(--color-danger);
}
.field-unsaved {
  font-size: 12px;
  color: var(--color-info);
  font-weight: 600;
}
.hidden {
  display: none !important;
}
.global-status {
  font-size: 12px;
  min-height: 16px;
  color: var(--color-muted);
}
.global-status.success {
  color: var(--color-success);
}
.global-status.error {
  color: var(--color-danger);
}
.global-updated {
  font-size: 12px;
  color: var(--color-subtext);
}
.summary-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 14px;
}
.summary-item span {
  font-weight: 600;
  font-size: 16px;
}
.device-grid {
  display: grid;
  gap: var(--card-gap);
  grid-template-columns: repeat(var(--card-columns), minmax(var(--card-min-width), 1fr));
  align-items: stretch;
}
.card {
  background: var(--color-surface);
  border-radius: 10px;
  padding: 12px;
  box-shadow: 0 6px 14px var(--shadow-elevated);
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.card.offline {
  opacity: 0.6;
}
.card.online-hidden {
  display: none;
}
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}
.card-header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}
button.card-delete-btn {
  display: none;
  padding: 6px 12px;
  font-size: 12px;
}
button.card-delete-btn.danger {
  background: var(--color-danger-strong);
}
button.card-delete-btn:disabled {
  opacity: 0.7;
  cursor: wait;
}
.card.editing button.card-delete-btn {
  display: inline-flex;
}
.device-title {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 4px;
}
.meta {
  font-size: 11px;
  color: var(--color-muted-soft);
  line-height: 1.45;
}
.ip-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 10px;
  border: 1px solid var(--color-border);
  border-radius: 10px;
  background: var(--color-surface-subtle);
  font-size: 13px;
}
.ip-row.offline {
  opacity: 0.6;
}
.ip-label {
  font-weight: 600;
  color: var(--color-heading);
}
.ip-value {
  font-family: "SFMono-Regular", "Consolas", "Menlo", monospace;
  font-size: 13px;
  color: var(--color-ip-highlight);
}
.ip-placeholder {
  color: var(--color-placeholder);
}
.status-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
}
.status-connected { background: var(--color-success-bg); color: var(--color-success); }
.status-disconnected { background: var(--color-danger-bg); color: var(--color-danger); }
.status-unknown { background: var(--color-chip-neutral-bg); color: var(--color-muted); }
.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
}
.domain-toggle {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}
.domain-option {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.domain-toggle label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--color-muted);
  padding: 4px 8px;
  border-radius: 999px;
  transition: background-color 0.16s ease, color 0.16s ease;
}
.domain-toggle label.checked {
  background: var(--color-accent-soft);
  color: var(--color-accent-strong);
  font-weight: 600;
}
.domain-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 38px;
  padding: 2px 7px;
  border-radius: 999px;
  background: var(--color-chip-neutral-bg);
  font-size: 11px;
  font-weight: 600;
  color: var(--color-muted-strong);
}
.domain-toggle label.checked .domain-count {
  background: var(--color-accent);
  color: var(--color-accent-text-contrast);
}
.domain-count.complete {
  background: var(--color-success-bg);
  color: var(--color-success);
}
.domain-toggle label.checked .domain-count.complete {
  background: var(--color-success-bg);
  color: var(--color-success);
}
.domain-option button.domain-add-btn {
  padding: 4px 10px;
  font-size: 11px;
}
.domain-summary {
  font-size: 12px;
  color: var(--color-muted);
  margin: 4px 0 0 0;
}
.domain-cycle {
  font-size: 12px;
  color: var(--color-success);
  margin: 2px 0 0 0;
  display: none;
  align-items: center;
  gap: 6px;
}
.domain-cycle.active {
  display: inline-flex;
}
.cycle-badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--color-success-bg);
  color: var(--color-success);
  font-weight: 600;
  font-size: 11px;
}
.cycle-meta {
  font-size: 11px;
  color: var(--color-muted-soft);
}
.config-block {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.field-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.field-row.helo-row {
  flex-wrap: nowrap;
  align-items: flex-end;
}
.field-row.helo-row .field {
  flex: 1 1 auto;
  min-width: 0;
}
.field-row.helo-row .field.compact {
  flex: 0 0 110px;
}
.field-row.helo-row .field.compact input {
  width: 100%;
}
@media (max-width: 640px) {
  .field-row.helo-row {
    flex-wrap: wrap;
  }
}
.field-row .field {
  flex: 1 1 160px;
}
.field.compact {
  flex: 0 0 100px;
}
.field.compact input {
  text-align: right;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 13px;
  color: var(--color-heading);
}
.field span { font-weight: 600; }
.field input,
.field textarea {
  padding: 8px 10px;
  border: 1px solid var(--color-border-strong);
  border-radius: 10px;
  background: var(--color-surface-subtle);
  font-size: 13px;
  font-family: inherit;
  color: var(--color-text);
}
.field textarea {
  min-height: 100px;
  resize: vertical;
}
.input-compact {
  max-width: 88px;
}
.action-bar {
  display: flex;
  align-items: flex-end;
  gap: 12px;
  flex-wrap: wrap;
}
.rcpt-field {
  flex: 1 1 220px;
}
.action-buttons {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: flex-end;
}
button {
  cursor: pointer;
  border: none;
  border-radius: 10px;
  padding: 8px 16px;
  font-weight: 600;
  font-size: 13px;
  background: var(--color-accent);
  color: var(--color-accent-text-contrast);
  transition: transform 0.12s ease, box-shadow 0.16s ease;
}
button.small {
  padding: 6px 12px;
  font-size: 12px;
}
button.secondary {
  background: var(--color-border);
  color: var(--color-muted-strong);
}
button.secondary.is-running,
button.secondary.is-running:disabled {
  background: var(--color-success);
  color: var(--color-accent-text-contrast);
  box-shadow: 0 10px 18px var(--shadow-success);
  opacity: 1;
  cursor: not-allowed;
}
button.ghost {
  background: transparent;
  border: 1px solid var(--color-ghost-border);
  color: var(--color-heading);
}
button.danger {
  background: var(--color-danger-strong);
}
button:disabled {
  cursor: not-allowed;
  opacity: 0.6;
  box-shadow: none;
}
button:not(:disabled):hover {
  transform: translateY(-1px);
  box-shadow: 0 10px 18px var(--shadow-hover);
}
.log-box {
  border: 1px solid var(--color-border);
  border-radius: 12px;
  padding: 12px;
  background: var(--color-surface);
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 180px;
}
.log-box-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}
.log-box-heading {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.log-box h4,
.log-box-header h4 {
  margin: 0;
  font-size: 13px;
  font-weight: 600;
}
.log-stats {
  font-size: 12px;
  font-weight: 600;
  color: var(--color-muted-strong);
}
.log-stats.secondary {
  font-weight: 500;
  color: var(--color-muted);
}

<script>
const GLOBAL_FIELD_LIST = ["active_domain", "helo", "mail_from", "header", "session_count", "bcc_count", "stop_schedule_time", "stop_schedule_enabled"];
const GLOBAL_DEFAULTS = {
  active_domain: "naver",
  helo: "",
  mail_from: "",
  header: "",
  session_count: "1",
  bcc_count: "0",
  stop_schedule_time: "",
  stop_schedule_enabled: false,
};
const GLOBAL_META_DEFAULTS = {
  stop_schedule_last_run: null,
  stop_schedule_next_run: null,
};
const GLOBAL_INPUT_IDS = {
  active_domain: "globalActiveDomainGroup",
  helo: "globalHelo",
  mail_from: "globalMailFrom",
  header: "globalHeader",
  session_count: "globalSessionCount",
  bcc_count: "globalBccCount",
  stop_schedule_time: "globalStopTime",
  stop_schedule_enabled: "globalStopEnabled",
};

const state = {
  devices: [],
  lastSync: null,
  modal: {
    open: false,
    deviceId: null,
    domain: null,
    deviceName: "",
  },
  pollingHandle: null,
  successCounters: {},
  globalConfig: { ...GLOBAL_DEFAULTS, ...GLOBAL_META_DEFAULTS, updated_at: null },
  globalDraft: { ...GLOBAL_DEFAULTS },
  globalDirty: {
    active_domain: false,
    helo: false,
    mail_from: false,
    header: false,
    session_count: false,
    bcc_count: false,
    stop_schedule_time: false,
    stop_schedule_enabled: false,
  },
  globalStatusTimer: null,
  scheduleEditing: {
    inputValue: "",
    sanitizedValue: "",
    dirty: false,
    error: "",
    saving: false,
  },
  deviceEditMode: false,
  filterOnlineOnly: false,
  deletingDevices: new Set(),
};

removeLegacyHiddenOfflinePreference();
state.filterOnlineOnly = loadOnlineOnlyPreference();

const DOMAIN_LABELS = { naver: "네이버", daum: "다음" };
const STATUS_LABELS = {
  connected: "온라인",
  disconnected: "오프라인",
};
const JOB_STATUS_LABELS = {
  pending: "대기 중",
  dispatched: "전송 준비",
  running: "진행 중",
  success: "완료",
  failed: "실패",
  cancelled: "중지됨",
};
const ACTIVE_JOB_STATES = new Set(["pending", "dispatched", "running"]);

const CONFIG_FIELDS = ["helo", "mail_from", "header", "session_count", "bcc_count", "anchor_interval", "anchor_email", "rcpt_to"];
const CARD_COLUMNS_KEY = "dashboard.cardColumns";
const CARD_COLUMNS_MIN = 2;
const CARD_COLUMNS_MAX = 6;
const CARD_COLUMNS_DEFAULT = 4;
const BCC_MIN = 1;
const BCC_MAX = 30;
const ANCHOR_MIN = 1;
const ANCHOR_MAX = 1000;
const fieldCache = {};
const cardRegistry = {};
const ONLINE_ONLY_KEY = "dashboard.onlineOnlyFilter";
const LEGACY_HIDDEN_OFFLINE_KEY = "dashboard.hiddenOfflineDevices";
const THEME_STORAGE_KEY = "dashboard.themePreference";
const VALID_THEMES = ["light", "dark", "system"];
let themePreference = "system";
const prefersDarkQuery = typeof window !== "undefined" && typeof window.matchMedia === "function"
  ? window.matchMedia("(prefers-color-scheme: dark)")
  : null;

function isValidTheme(value) {
  return VALID_THEMES.includes(value);
}

function loadThemePreference() {
  try {
    const stored = localStorage.getItem(THEME_STORAGE_KEY);
    if (isValidTheme(stored)) {
      return stored;
    }
  } catch (err) {
    console.warn("테마 설정을 불러오지 못했습니다.", err);
  }
  return "system";
}

function persistThemePreference(theme) {
  try {
    localStorage.setItem(THEME_STORAGE_KEY, theme);
  } catch (err) {
    console.warn("테마 설정 저장에 실패했습니다.", err);
  }
}

function applyThemePreference(theme) {
  const root = document.documentElement;
  if (theme === "light") {
    root.setAttribute("data-theme", "light");
  } else if (theme === "dark") {
    root.setAttribute("data-theme", "dark");
  } else {
    root.removeAttribute("data-theme");
    theme = "system";
  }
  root.dataset.themePreference = theme;
}

function syncThemeSelect(theme) {
  const select = document.getElementById("themeSelect");
  if (select && select.value !== theme) {
    select.value = theme;
  }
}

function handleThemeSelectChange(event) {
  const next = event.target.value;
  themePreference = isValidTheme(next) ? next : "system";
  persistThemePreference(themePreference);
  applyThemePreference(themePreference);
}

function handleSystemThemeChange() {
  if (themePreference === "system") {
    applyThemePreference("system");
  }
}

function initThemeControl() {
  themePreference = loadThemePreference();
  applyThemePreference(themePreference);
  syncThemeSelect(themePreference);
  const select = document.getElementById("themeSelect");
  if (select) {
    select.addEventListener("change", handleThemeSelectChange);
  }
  if (prefersDarkQuery) {
    if (typeof prefersDarkQuery.addEventListener === "function") {
      prefersDarkQuery.addEventListener("change", handleSystemThemeChange);
    } else if (typeof prefersDarkQuery.addListener === "function") {
      prefersDarkQuery.addListener(handleSystemThemeChange);
    }
  }
}

function clampNumber(value, min, max, fallback) {
  const parsed = typeof value === "number" ? value : parseInt(value, 10);
  if (Number.isNaN(parsed)) {
    return fallback;
  }
  return Math.min(max, Math.max(min, parsed));
}

function loadOnlineOnlyPreference() {
  try {
    const stored = localStorage.getItem(ONLINE_ONLY_KEY);
    return stored === "true";
  } catch (err) {
    console.warn("온라인 필터 설정을 불러오지 못했습니다.", err);
    return false;
  }
}

function persistOnlineOnlyPreference(enabled) {
  try {
    localStorage.setItem(ONLINE_ONLY_KEY, enabled ? "true" : "false");
  } catch (err) {
    console.warn("온라인 필터 설정 저장에 실패했습니다.", err);
  }
}

function removeLegacyHiddenOfflinePreference() {
  try {
    localStorage.removeItem(LEGACY_HIDDEN_OFFLINE_KEY);
  } catch (err) {
    console.warn("이전 숨김 오프라인 설정 제거에 실패했습니다.", err);
  }
}

function parseBccInput(value) {
  if (value === undefined || value === null) return 0;
  const trimmed = String(value).trim();
  if (!trimmed) return 0;
  if (trimmed === "0") return 0;
  return clampNumber(trimmed, BCC_MIN, BCC_MAX, BCC_MIN);
}

function formatBccValue(value) {
  const parsed = typeof value === "number" ? value : parseInt(value, 10);
  if (Number.isNaN(parsed) || parsed <= 0) {
    return "0";
  }
  return String(clampNumber(parsed, BCC_MIN, BCC_MAX, BCC_MIN));
}

function parseAnchorInput(value) {
  if (value === undefined || value === null) return 0;
  const trimmed = String(value).trim();
  if (!trimmed) return 0;
  if (trimmed === "0") return 0;
  return clampNumber(trimmed, ANCHOR_MIN, ANCHOR_MAX, ANCHOR_MIN);
}

function formatAnchorValue(value) {
  const parsed = typeof value === "number" ? value : parseInt(value, 10);
  if (Number.isNaN(parsed) || parsed <= 0) {
    return "0";
  }
  return String(clampNumber(parsed, ANCHOR_MIN, ANCHOR_MAX, ANCHOR_MIN));
}

function sanitizeSessionValue(value) {
  const parsed = parseInt(String(value ?? "").trim(), 10);
  if (Number.isNaN(parsed) || parsed < 1) {
    return "1";
  }
  return String(parsed);
}

function sanitizeBccValue(value) {
  const trimmed = String(value ?? "").trim();
  if (!trimmed || trimmed === "0") {
    return "0";
  }
  const parsed = parseInt(trimmed, 10);
  if (Number.isNaN(parsed) || parsed <= 0) {
    return "0";
  }
  return String(clampNumber(parsed, BCC_MIN, BCC_MAX, BCC_MIN));
}

function sanitizeGlobalDomain(value) {
  const candidate = String(value ?? "").trim().toLowerCase();
  if (candidate === "daum") {
    return "daum";
  }
  return "naver";
}

function normalizeDeviceDomain(value) {
  const candidate = String(value ?? "").trim().toLowerCase();
  if (candidate === "daum") {
    return "daum";
  }
  if (candidate === "naver") {
    return "naver";
  }
  return "naver";
}

function sanitizeScheduleTime(value) {
  if (value === undefined || value === null) {
    return "";
  }
  const trimmed = String(value).trim();
  if (!trimmed) {
    return "";
  }
  const match = trimmed.match(/^([0-1]?\d|2[0-3]):([0-5]\d)$/);
  if (!match) {
    return "";
  }
  const hours = match[1].padStart(2, "0");
  const minutes = match[2];
  return `${hours}:${minutes}`;
}

function sanitizeAnchorValue(value) {
  const trimmed = String(value ?? "").trim();
  if (!trimmed || trimmed === "0") {
    return "0";
  }
  const parsed = parseInt(trimmed, 10);
  if (Number.isNaN(parsed) || parsed <= 0) {
    return "0";
  }
  return String(clampNumber(parsed, ANCHOR_MIN, ANCHOR_MAX, ANCHOR_MIN));
}

function applyCardColumns(value) {
  document.documentElement.style.setProperty("--card-columns", value);
}

function initCardColumnControl() {
  const input = document.getElementById("cardColumnsInput");
  if (!input) return;
  const saved = clampNumber(localStorage.getItem(CARD_COLUMNS_KEY), CARD_COLUMNS_MIN, CARD_COLUMNS_MAX, CARD_COLUMNS_DEFAULT);
  applyCardColumns(saved);
  input.value = saved;
  input.addEventListener("change", () => {
    const next = clampNumber(input.value, CARD_COLUMNS_MIN, CARD_COLUMNS_MAX, CARD_COLUMNS_DEFAULT);
    input.value = next;
    applyCardColumns(next);
    localStorage.setItem(CARD_COLUMNS_KEY, next);
  });
}

function initialFieldValues(config) {
  return {
    helo: config?.helo || "",
    mail_from: config?.mail_from || "",
    header: config?.header || "",
    session_count: sanitizeSessionValue(config?.session_count ?? "1"),
    bcc_count: formatBccValue(config?.bcc_count ?? 0),
    anchor_interval: formatAnchorValue(config?.anchor_interval ?? 0),
    anchor_email: config?.anchor_email || "",
    rcpt_to: config?.rcpt_to || "",
  };
}

function ensureFieldCache(deviceId, domain, config) {
  if (!fieldCache[deviceId]) {
    fieldCache[deviceId] = {};
  }
  const store = fieldCache[deviceId];
  const defaults = initialFieldValues(config);
  if (!store[domain]) {
    store[domain] = { values: defaults, dirty: false };
  } else if (!store[domain].dirty) {
    store[domain].values = defaults;
  }
  return store[domain];
}

function markFieldDirty(deviceId, domain, field, value) {
  const entry = fieldCache[deviceId]?.[domain];
  if (!entry) {
    return;
  }
  entry.values[field] = value;
  entry.dirty = true;
}

function resetFieldDirty(deviceId, domain, config) {
  const entry = ensureFieldCache(deviceId, domain, config);
  entry.dirty = false;
}

function collectConfigPayload(card, currentDevice, domain) {
  const sessionInput = card.querySelector('[data-field="session_count"]');
  const sessionValue = sanitizeSessionValue(sessionInput?.value ?? "1");
  if (sessionInput && sessionInput.value !== sessionValue) {
    sessionInput.value = sessionValue;
  }

  const bccInput = card.querySelector('[data-field="bcc_count"]');
  const bccValue = sanitizeBccValue(bccInput?.value ?? "0");
  if (bccInput && bccInput.value !== bccValue) {
    bccInput.value = bccValue;
  }

  const anchorIntervalInput = card.querySelector('[data-field="anchor_interval"]');
  const anchorIntervalValue = sanitizeAnchorValue(anchorIntervalInput?.value ?? "0");
  if (anchorIntervalInput && anchorIntervalInput.value !== anchorIntervalValue) {
    anchorIntervalInput.value = anchorIntervalValue;
  }

  const anchorEmailInput = card.querySelector('[data-field="anchor_email"]');
  const anchorEmailValue = anchorEmailInput?.value?.trim() ?? "";

  return {
    payload: {
      helo: card.querySelector('[data-field="helo"]').value.trim(),
      smtp_host: (currentDevice.configs?.[domain]?.smtp_host || "").trim(),
      mail_from: card.querySelector('[data-field="mail_from"]').value.trim(),
      header: card.querySelector('[data-field="header"]').value,
      session_count: Number(sessionValue) || 1,
      bcc_count: parseBccInput(bccValue),
      anchor_interval: parseAnchorInput(anchorIntervalValue),
      anchor_email: anchorEmailValue,
      rcpt_to: card.querySelector('[data-field="rcpt_to"]').value.trim(),
    },
  };
}

async function saveConfig(card, currentDevice, domain) {
  const { payload } = collectConfigPayload(card, currentDevice, domain);
  const updated = await fetchJSON(`/api/devices/${currentDevice.id}/domains/${domain}/config`, {
    method: "PUT",
    body: JSON.stringify(payload),
  });
  currentDevice.configs = currentDevice.configs || {};
  currentDevice.configs[domain] = updated;
  card.__deviceData = { ...currentDevice };
  resetFieldDirty(currentDevice.id, domain, updated);
  populateConfigForm(card, currentDevice, domain);
  return updated;
}

async function ensureConfigSynced(card, currentDevice, domain) {
  const cacheEntry = fieldCache[currentDevice.id]?.[domain];
  if (!cacheEntry?.dirty) {
    return;
  }
  await saveConfig(card, currentDevice, domain);
}

function getActiveDomain(card, fallback) {
  return card.dataset.activeDomain || fallback || "naver";
}

function formatDate(iso) {
  if (!iso) return "정보 없음";
  try {
    const date = new Date(iso);
    if (Number.isNaN(date.getTime())) return iso;
    const yyyy = date.getFullYear();
    const mm = String(date.getMonth() + 1).padStart(2, "0");
    const dd = String(date.getDate()).padStart(2, "0");
    const hh = String(date.getHours()).padStart(2, "0");
    const mi = String(date.getMinutes()).padStart(2, "0");
    const ss = String(date.getSeconds()).padStart(2, "0");
    return `${yyyy}-${mm}-${dd} ${hh}:${mi}:${ss}`;
  } catch (err) {
    return iso;
  }
}

function formatCount(value) {
  const numeric = Number(value) || 0;
  return numeric.toLocaleString("ko-KR");
}

function formatScheduleDate(value) {
  if (!value) return null;
  const str = String(value).trim();
  if (!str) return null;
  if (/^\d{4}-\d{2}-\d{2}$/.test(str)) {
    return str;
  }
  return formatDate(str);
}

function updateStopScheduleStatus(config, options = {}) {
  const { force = false } = options;
  const enabled = Boolean(config?.stop_schedule_enabled);
  const timeValue = sanitizeScheduleTime(config?.stop_schedule_time);
  const card = document.getElementById("globalStopScheduleCard");
  const pillEl = document.getElementById("globalStopStatusPill");
  const statusTextEl = document.getElementById("globalStopStatusText");
  const nextRunEl = document.getElementById("globalStopNextRun");
  const lastRunEl = document.getElementById("globalStopLastRun");
  const nextRunLabel = config?.stop_schedule_next_run ? formatDate(config.stop_schedule_next_run) : null;
  const lastRunLabel = formatScheduleDate(config?.stop_schedule_last_run);
  const isDirty = Boolean(state.globalDirty?.stop_schedule_enabled);
  const allowStatusUpdate = force || !isDirty;
  if (allowStatusUpdate) {
    if (card) {
      card.classList.toggle("active", enabled && !!timeValue);
    }
    if (pillEl) {
      pillEl.textContent = enabled ? "활성" : "비활성";
      pillEl.classList.toggle("active", enabled);
    }
    if (statusTextEl) {
      if (enabled && timeValue) {
        statusTextEl.textContent = `활성 (매일 ${timeValue})`;
      } else if (!enabled && timeValue) {
        statusTextEl.textContent = `비활성 (저장된 시간 ${timeValue})`;
      } else {
        statusTextEl.textContent = enabled ? "활성" : "비활성";
      }
    }
  }
  if (nextRunEl) {
    nextRunEl.textContent = enabled && nextRunLabel ? nextRunLabel : "--";
  }
  if (lastRunEl) {
    lastRunEl.textContent = lastRunLabel || "--";
  }
  setStopScheduleEnabledUI(enabled, { force });
}

function setStopScheduleEnabledUI(enabled, options = {}) {
  const { force = false } = options;
  const isDirty = Boolean(state.globalDirty?.stop_schedule_enabled);
  const allowUpdate = force || !isDirty;
  const toggle = document.getElementById("globalStopEnabled");
  const card = document.getElementById("globalStopScheduleCard");
  const pillEl = document.getElementById("globalStopStatusPill");
  if (toggle && allowUpdate && toggle.checked !== enabled) {
    toggle.checked = enabled;
  }
  if (allowUpdate && card) {
    card.classList.toggle("active", enabled);
  }
  if (allowUpdate && pillEl) {
    pillEl.textContent = enabled ? "활성" : "비활성";
    pillEl.classList.toggle("active", enabled);
  }
  const timeInput = document.getElementById("globalStopTime");
  if (timeInput && allowUpdate) {
    timeInput.classList.toggle("schedule-input-disabled", !enabled);
  }
}

function getSavedScheduleTime() {
  return sanitizeScheduleTime(state.globalDraft?.stop_schedule_time ?? state.globalConfig?.stop_schedule_time ?? "");
}

function syncScheduleEditingFromConfig(config, options = {}) {
  const { force = false } = options;
  const saved = sanitizeScheduleTime(config?.stop_schedule_time ?? getSavedScheduleTime());
  if (!force && state.scheduleEditing.dirty) {
    updateScheduleEditingUI();
    return;
  }
  state.scheduleEditing = {
    inputValue: saved,
    sanitizedValue: saved,
    dirty: false,
    error: "",
    saving: false,
  };
  state.globalDirty.stop_schedule_time = false;
  const input = document.getElementById("globalStopTime");
  if (input) {
    input.value = saved;
  }
  updateScheduleEditingUI();
}

function updateScheduleEditingUI() {
  const actionsEl = document.getElementById("globalStopTimeActions");
  const saveBtn = document.getElementById("globalStopTimeSaveBtn");
  const cancelBtn = document.getElementById("globalStopTimeCancelBtn");
  const errorEl = document.getElementById("globalStopTimeError");
  const unsavedEl = document.getElementById("globalStopTimeUnsaved");
  const disabledHintEl = document.getElementById("globalStopTimeDisabledHint");
  const toggleEl = document.getElementById("globalStopEnabled");
  const isEnabled = Boolean(toggleEl?.checked);
  const { dirty, error, sanitizedValue, saving } = state.scheduleEditing;
  if (actionsEl) {
    actionsEl.classList.toggle("hidden", !dirty);
  }
  if (saveBtn) {
    saveBtn.disabled = !dirty || !sanitizedValue || Boolean(error) || saving;
    saveBtn.textContent = saving ? "저장 중..." : "저장";
  }
  if (cancelBtn) {
    cancelBtn.disabled = !dirty || saving;
  }
  if (errorEl) {
    if (error) {
      errorEl.textContent = error;
      errorEl.classList.remove("hidden");
    } else {
      errorEl.textContent = "";
      errorEl.classList.add("hidden");
    }
  }
  if (unsavedEl) {
    unsavedEl.classList.toggle("hidden", !dirty || saving);
  }
  if (disabledHintEl) {
    const showHint = !isEnabled && dirty && !saving;
    disabledHintEl.classList.toggle("hidden", !showHint);
  }
}

function formatScheduleInputValue(raw) {
  if (raw === undefined || raw === null) {
    return "";
  }
  const digits = String(raw).replace(/\D/g, "").slice(0, 4);
  if (digits.length <= 2) {
    return digits;
  }
  const hours = digits.slice(0, 2);
  const minutes = digits.slice(2);
  return minutes ? `${hours}:${minutes}` : hours;
}

function handleStopTimeInput(event) {
  const input = event.target;
  const formatted = formatScheduleInputValue(input.value);
  if (input.value !== formatted) {
    input.value = formatted;
  }
  const saved = getSavedScheduleTime();
  const sanitized = sanitizeScheduleTime(formatted);
  let error = "";
  const isComplete = formatted.length === 5;
  if (isComplete && !sanitized) {
    error = "24시간 형식(HH:MM)으로 입력하세요.";
  }
  const dirty = formatted !== saved;
  state.scheduleEditing = {
    ...state.scheduleEditing,
    inputValue: formatted,
    sanitizedValue: sanitized,
    dirty,
    error,
  };
  state.globalDirty.stop_schedule_time = dirty;
  updateScheduleEditingUI();
}

function handleStopTimeBlur(event) {
  const input = event.target;
  const sanitized = sanitizeScheduleTime(input.value);
  if (sanitized) {
    input.value = sanitized;
  }
  const saved = getSavedScheduleTime();
  const formatted = input.value;
  const dirty = formatted !== saved;
  let error = "";
  if (formatted && !sanitizeScheduleTime(formatted)) {
    error = "24시간 형식(HH:MM)으로 입력하세요.";
  }
  state.scheduleEditing = {
    ...state.scheduleEditing,
    inputValue: formatted,
    sanitizedValue: sanitizeScheduleTime(formatted),
    dirty,
    error,
  };
  state.globalDirty.stop_schedule_time = dirty;
  updateScheduleEditingUI();
}

function handleStopTimeCancel(event) {
  event.preventDefault();
  const saved = getSavedScheduleTime();
  const input = document.getElementById("globalStopTime");
  if (input) {
    input.value = saved;
  }
  state.scheduleEditing = {
    inputValue: saved,
    sanitizedValue: saved,
    dirty: false,
    error: "",
    saving: false,
  };
  state.globalDirty.stop_schedule_time = false;
  updateScheduleEditingUI();
}

async function handleStopTimeSave(event) {
  event.preventDefault();
  const currentToggle = Boolean(document.getElementById("globalStopEnabled")?.checked);
  let sanitized = state.scheduleEditing.sanitizedValue;
  if (!sanitized) {
    sanitized = sanitizeScheduleTime(document.getElementById("globalStopTime")?.value || "");
  }
  if (!sanitized) {
    state.scheduleEditing = {
      ...state.scheduleEditing,
      error: "24시간 형식(HH:MM)으로 시간을 입력한 뒤 저장하세요.",
    };
    updateScheduleEditingUI();
    return;
  }
  await submitStopScheduleUpdate({
    enabled: currentToggle,
    time: sanitized,
    reason: currentToggle ? "time-change-active" : "time-change-inactive",
    source: "save",
  });
}

async function handleStopToggleChange(event) {
  const toggle = event.target;
  const wantsEnable = Boolean(toggle.checked);
  const saved = getSavedScheduleTime();
  const editing = state.scheduleEditing;
  const candidate = editing.sanitizedValue || (!editing.dirty ? saved : "");
  if (wantsEnable && !candidate) {
    toggle.checked = false;
    setStopScheduleEnabledUI(false, { force: true });
    state.scheduleEditing = {
      ...state.scheduleEditing,
      error: "예약을 켜려면 24시간 형식(HH:MM)의 시간을 먼저 입력하세요.",
    };
    updateScheduleEditingUI();
    setGlobalStatus("유효한 예약 시간을 먼저 입력해야 자동 중지 예약을 켤 수 있습니다.", "error");
    return;
  }
  const pendingTime = sanitizeScheduleTime(candidate || saved);
  state.globalDirty.stop_schedule_enabled = true;
  updateStopScheduleStatus(
    {
      stop_schedule_enabled: wantsEnable,
      stop_schedule_time: pendingTime,
      stop_schedule_next_run: wantsEnable ? state.globalConfig.stop_schedule_next_run : null,
      stop_schedule_last_run: state.globalConfig.stop_schedule_last_run,
    },
    { force: true },
  );
  toggle.disabled = true;
  await submitStopScheduleUpdate({
    enabled: wantsEnable,
    time: candidate || saved,
    reason: wantsEnable ? "toggle-on" : "toggle-off",
    source: "toggle",
  });
  toggle.disabled = false;
}

async function submitStopScheduleUpdate(options) {
  const { enabled, time, reason, source } = options;
  const toggleEl = document.getElementById("globalStopEnabled");
  const previousEnabled = Boolean(state.globalConfig.stop_schedule_enabled);
  const sanitizedTime = sanitizeScheduleTime(time);
  state.scheduleEditing = {
    ...state.scheduleEditing,
    error: "",
    saving: source === "save",
  };
  updateScheduleEditingUI();
  const payload = {
    helo: state.globalDraft?.helo ?? "",
    mail_from: state.globalDraft?.mail_from ?? "",
    header: state.globalDraft?.header ?? "",
    session_count: Number(sanitizeSessionValue(state.globalDraft?.session_count ?? GLOBAL_DEFAULTS.session_count)),
    bcc_count: parseBccInput(state.globalDraft?.bcc_count ?? GLOBAL_DEFAULTS.bcc_count),
    stop_schedule_enabled: Boolean(enabled),
    stop_schedule_time: sanitizedTime,
  };
  try {
    const result = await fetchJSON("/api/global/config/apply", {
      method: "POST",
      body: JSON.stringify(payload),
    });
    const serverConfig = { ...(result.config || {}), updated_at: result.updated_at || null };
    state.globalDirty.stop_schedule_time = false;
    state.globalDirty.stop_schedule_enabled = false;
    state.scheduleEditing = {
      inputValue: "",
      sanitizedValue: "",
      dirty: false,
      error: "",
      saving: false,
    };
    renderGlobalConfig(serverConfig);
    const newEnabled = Boolean(serverConfig.stop_schedule_enabled);
    const newTime = sanitizeScheduleTime(serverConfig.stop_schedule_time);
    let message = "";
    if (reason === "toggle-on") {
      message = newTime
        ? `자동 중지 예약이 매일 ${newTime}에 실행되도록 활성화되었습니다.`
        : "자동 중지 예약을 활성화했습니다.";
    } else if (reason === "toggle-off") {
      message = "자동 중지 예약을 비활성화했습니다.";
    } else if (reason === "time-change-active") {
      message = newTime
        ? `자동 중지 예약 시간이 ${newTime}로 변경되었습니다.`
        : "자동 중지 예약 시간을 업데이트했습니다.";
    } else if (reason === "time-change-inactive") {
      message = newTime
        ? `예약 시간이 ${newTime}로 저장되었습니다. 예약을 켜면 즉시 적용됩니다.`
        : "예약 시간이 저장되었습니다.";
    } else {
      message = "자동 중지 예약을 업데이트했습니다.";
    }
    setGlobalStatus(message, "success");
  } catch (err) {
    if (toggleEl) {
      toggleEl.checked = previousEnabled;
    }
    state.globalDirty.stop_schedule_enabled = false;
    setStopScheduleEnabledUI(previousEnabled, { force: true });
    state.scheduleEditing = {
      ...state.scheduleEditing,
      dirty: state.scheduleEditing.dirty,
      saving: false,
      error: err?.message || "변경 사항을 저장하지 못했습니다. 다시 시도하세요.",
    };
    updateScheduleEditingUI();
    setGlobalStatus(err?.message || "자동 중지 예약 업데이트에 실패했습니다.", "error");
  } finally {
    state.globalDirty.stop_schedule_enabled = false;
    if (source !== "save") {
      state.scheduleEditing = {
        ...state.scheduleEditing,
        saving: false,
      };
    }
    updateScheduleEditingUI();
  }
}

function setGlobalStatus(message, type = "info") {
  const statusEl = document.getElementById("globalStatus");
  if (!statusEl) return;
  if (state.globalStatusTimer) {
    clearTimeout(state.globalStatusTimer);
    state.globalStatusTimer = null;
  }
  const className = type === "success"
    ? "global-status success"
    : type === "error"
      ? "global-status error"
      : "global-status";
  statusEl.className = className;
  statusEl.textContent = message || "";
  if (message) {
    state.globalStatusTimer = setTimeout(() => {
      statusEl.className = "global-status";
      statusEl.textContent = "";
      state.globalStatusTimer = null;
    }, 4000);
  }
}

function normalizeGlobalFieldValue(field, value) {
  if (field === "active_domain") {
    return sanitizeGlobalDomain(value ?? GLOBAL_DEFAULTS.active_domain);
  }
  if (field === "session_count") {
    return sanitizeSessionValue(value ?? "");
  }
  if (field === "bcc_count") {
    return sanitizeBccValue(value ?? "");
  }
  if (field === "stop_schedule_time") {
    return sanitizeScheduleTime(value ?? "");
  }
  if (field === "stop_schedule_enabled") {
    if (value === undefined || value === null) {
      return Boolean(GLOBAL_DEFAULTS.stop_schedule_enabled);
    }
    return Boolean(value);
  }
  if (value === undefined || value === null) {
    return GLOBAL_DEFAULTS[field];
  }
  return String(value);
}

function normalizeGlobalConfig(config) {
  const normalized = {};
  GLOBAL_FIELD_LIST.forEach((field) => {
    normalized[field] = normalizeGlobalFieldValue(field, config?.[field]);
  });
  normalized.updated_at = config?.updated_at || null;
  normalized.stop_schedule_last_run = config?.stop_schedule_last_run || GLOBAL_META_DEFAULTS.stop_schedule_last_run;
  normalized.stop_schedule_next_run = config?.stop_schedule_next_run || GLOBAL_META_DEFAULTS.stop_schedule_next_run;
  return normalized;
}

function syncGlobalInputsFromDraft(options = {}) {
  const { force = false } = options;
  GLOBAL_FIELD_LIST.forEach((field) => {
    if (!force && state.globalDirty[field]) {
      return;
    }
     if (field === "active_domain") {
       const normalizedDomain = normalizeGlobalFieldValue(field, state.globalDraft[field]);
       state.globalDraft[field] = normalizedDomain;
       const radios = document.querySelectorAll('input[name="globalActiveDomain"]');
       if (!radios.length) {
         return;
       }
       radios.forEach((radio) => {
         radio.checked = radio.value === normalizedDomain;
       });
       return;
     }
    const input = document.getElementById(GLOBAL_INPUT_IDS[field]);
    if (!input) {
      return;
    }
    const normalizedValue = normalizeGlobalFieldValue(field, state.globalDraft[field]);
    state.globalDraft[field] = normalizedValue;
    if (input.type === "checkbox") {
      if (force || document.activeElement !== input) {
        input.checked = Boolean(normalizedValue);
      }
      if (field === "stop_schedule_enabled") {
        setStopScheduleEnabledUI(Boolean(normalizedValue));
      }
    } else if (force || document.activeElement !== input) {
      input.value = normalizedValue;
    }
  });
}

function applyValuesToGlobalDraft(values, options = {}) {
  const { markDirty = true, force = true } = options;
  if (!values) {
    return;
  }
  Object.entries(values).forEach(([field, value]) => {
    if (!GLOBAL_FIELD_LIST.includes(field)) {
      return;
    }
    const normalized = normalizeGlobalFieldValue(field, value);
    state.globalDraft[field] = normalized;
    state.globalDirty[field] = markDirty;
  });
  if (force) {
    syncGlobalInputsFromDraft({ force: true });
  }
}

function initGlobalForm() {
  GLOBAL_FIELD_LIST.forEach((field) => {
    if (field === "active_domain") {
      const radios = document.querySelectorAll('input[name="globalActiveDomain"]');
      if (!radios.length) {
        return;
      }
      radios.forEach((radio) => {
        radio.addEventListener("change", () => {
          if (!radio.checked) {
            return;
          }
          const sanitized = sanitizeGlobalDomain(radio.value);
          state.globalDirty.active_domain = true;
          state.globalDraft.active_domain = sanitized;
        });
      });
      return;
    }
    const input = document.getElementById(GLOBAL_INPUT_IDS[field]);
    if (!input) return;
    if (field === "stop_schedule_enabled" || field === "stop_schedule_time") {
      return;
    }
    input.addEventListener("input", () => {
      state.globalDirty[field] = true;
      state.globalDraft[field] = input.value;
    });
    if (field === "session_count") {
      input.addEventListener("blur", () => {
        const sanitized = sanitizeSessionValue(input.value);
        if (input.value !== sanitized) {
          input.value = sanitized;
        }
        state.globalDraft[field] = sanitized;
        state.globalDirty[field] = true;
      });
    } else if (field === "bcc_count") {
      input.addEventListener("blur", () => {
        const sanitized = sanitizeBccValue(input.value);
        if (input.value !== sanitized) {
          input.value = sanitized;
        }
        state.globalDraft[field] = sanitized;
        state.globalDirty[field] = true;
      });
    }
  });
  const stopToggle = document.getElementById("globalStopEnabled");
  if (stopToggle) {
    stopToggle.addEventListener("change", handleStopToggleChange);
  }
  const stopTimeInput = document.getElementById("globalStopTime");
  if (stopTimeInput) {
    stopTimeInput.addEventListener("input", handleStopTimeInput);
    stopTimeInput.addEventListener("blur", handleStopTimeBlur);
  }
  const stopSaveBtn = document.getElementById("globalStopTimeSaveBtn");
  if (stopSaveBtn) {
    stopSaveBtn.addEventListener("click", handleStopTimeSave);
  }
  const stopCancelBtn = document.getElementById("globalStopTimeCancelBtn");
  if (stopCancelBtn) {
    stopCancelBtn.addEventListener("click", handleStopTimeCancel);
  }
}

function renderGlobalConfig(config) {
  if (!config) {
    return;
  }
  const incomingUpdatedAt = config?.updated_at || null;
  const currentUpdatedAt = state.globalConfig?.updated_at || null;
  if (incomingUpdatedAt && currentUpdatedAt) {
    const incomingTime = Date.parse(incomingUpdatedAt);
    const currentTime = Date.parse(currentUpdatedAt);
    if (!Number.isNaN(incomingTime) && !Number.isNaN(currentTime) && incomingTime < currentTime) {
      return;
    }
  }
  const normalized = normalizeGlobalConfig(config || {});
  const updatedAtEl = document.getElementById("globalUpdatedAt");
  state.globalConfig = { ...normalized };
  GLOBAL_FIELD_LIST.forEach((field) => {
    if (!state.globalDirty[field]) {
      state.globalDraft[field] = normalized[field];
    }
  });
  syncGlobalInputsFromDraft();
  updateStopScheduleStatus(normalized);
  const shouldForceSyncSchedule = !state.globalDirty.stop_schedule_time;
  syncScheduleEditingFromConfig(normalized, { force: shouldForceSyncSchedule });
  if (updatedAtEl) {
    if (normalized.updated_at) {
      updatedAtEl.textContent = `마지막 적용: ${formatDate(normalized.updated_at)}`;
    } else {
      updatedAtEl.textContent = "아직 적용 기록이 없습니다.";
    }
  }
}

function parseSendLogPayload(payload) {
  if (!payload || typeof payload !== "string") {
    return null;
  }
  const parts = payload.split("|");
  if (parts.length < 3) {
    return null;
  }
  const rawLabel = parts[0] ?? "";
  const rawCount = parts[1] ?? "";
  const rawEmail = parts[2] ?? "";
  let timestamp = null;
  let metaStartIndex = 3;
  if (parts.length >= 4) {
    const candidate = (parts[3] ?? "").trim();
    if (candidate && !candidate.includes("=")) {
      timestamp = candidate;
      metaStartIndex = 4;
    } else {
      metaStartIndex = 3;
    }
  }
  const meta = {};
  for (let i = metaStartIndex; i < parts.length; i += 1) {
    const segment = parts[i];
    if (!segment) continue;
    const [key, value] = segment.split("=", 2);
    if (!key) continue;
    const normalizedKey = key.trim().toLowerCase();
    if (!normalizedKey) continue;
    meta[normalizedKey] = (value ?? "").trim();
  }
  const label = (rawLabel || "").trim();
  const email = (rawEmail || "").trim();
  const countValue = parseInt((rawCount || "").trim(), 10);
  const count = Number.isNaN(countValue) ? null : countValue;
  const primaryFlag = meta.primary ?? null;
  const isPrimary = typeof primaryFlag === "string"
    ? ["1", "true", "yes"].includes(primaryFlag.toLowerCase())
    : false;
  let bccCount = null;
  if (typeof meta.bcc === "string" && meta.bcc) {
    const parsedBcc = parseInt(meta.bcc, 10);
    if (!Number.isNaN(parsedBcc) && parsedBcc > 0) {
      bccCount = parsedBcc;
    }
  }
  let anchorCount = null;
  if (typeof meta.anchor === "string" && meta.anchor) {
    const parsedAnchor = parseInt(meta.anchor, 10);
    if (!Number.isNaN(parsedAnchor) && parsedAnchor > 0) {
      anchorCount = parsedAnchor;
    }
  }
  return { label, email, count, timestamp, meta, isPrimary, bccCount, anchorCount };
}

function buildLogDisplayText(entry) {
  const parsed = parseSendLogPayload(entry?.response);
  if (!parsed || !parsed.label || !parsed.email) {
    return entry?.response || entry?.log || "-";
  }
  let suffix = "";
  if (parsed.isPrimary) {
    if (typeof parsed.bccCount === "number" && parsed.bccCount > 0) {
      suffix += ` 외 ${parsed.bccCount}`;
    }
    if (typeof parsed.anchorCount === "number" && parsed.anchorCount > 0) {
      suffix += ` + 알박기 ${parsed.anchorCount}`;
    }
  }
  return `${parsed.label} - ${parsed.email}${suffix}`;
}

function latestChangeIpJob(device) {
  if (!device?.jobs?.length) {
    return null;
  }
  const candidates = device.jobs.filter((job) => job.job_type === "change_ip");
  if (!candidates.length) {
    return null;
  }
  return [...candidates].sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0))[0];
}

function latestSingleJob(device, domain) {
  if (!device?.jobs?.length) {
    return null;
  }
  const targetDomain = normalizeDeviceDomain(domain || device.active_domain || "naver");
  const candidates = device.jobs.filter((job) => {
    if (job.job_type !== "single_send") {
      return false;
    }
    const jobDomain = normalizeDeviceDomain(job.domain || device.active_domain || targetDomain);
    return jobDomain === targetDomain;
  });
  if (!candidates.length) {
    return null;
  }
  return [...candidates].sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0))[0];
}


function latestBatchJob(device) {
  if (!device?.jobs?.length) {
    return null;
  }
  const candidates = device.jobs.filter((job) => job.job_type === "batch_send");
  if (!candidates.length) {
    return null;
  }
  return [...candidates].sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0))[0];
}

function parseSummaryNumber(value) {
  const num = Number(value);
  return Number.isFinite(num) ? num : 0;
}

function extractSummaryPayload(payload) {
  if (!payload || typeof payload !== "object") {
    return null;
  }
  if (payload.summary && typeof payload.summary === "object") {
    return extractSummaryPayload(payload.summary);
  }
  const hasExpectedField = ["processed", "sent", "failed", "bcc", "anchor"].some((key) => Object.prototype.hasOwnProperty.call(payload, key));
  return hasExpectedField ? payload : null;
}

function latestJobSummary(job) {
  if (!job) {
    return null;
  }
  const progress = Array.isArray(job.progress) ? job.progress : [];
  for (let i = progress.length - 1; i >= 0; i -= 1) {
    const candidate = extractSummaryPayload(progress[i]?.data);
    if (candidate) {
      return candidate;
    }
  }
  const resultSummary = extractSummaryPayload(job.result);
  if (resultSummary) {
    return resultSummary;
  }
  return null;
}

function hasActiveBatchJob(device) {
  if (!device?.jobs?.length) {
    return false;
  }
  return device.jobs.some((job) => job.job_type === "batch_send" && (ACTIVE_JOB_STATES.has(job.status) || (job.status === "running" && job.cancel_requested)));
}

function renderDomainSummary(card, device, domain) {
  const summaryEl = card.querySelector('[data-role="domainSummary"]');
  const cycleEl = card.querySelector('[data-role="domainCycle"]');
  const activeConfig = bestConfig(device, domain);
  const activeTotal = Number(activeConfig?.client_total ?? 0);
  const activeRemaining = Number(
    activeConfig?.client_remaining ??
    activeConfig?.client_pending ??
    0,
  );
  if (summaryEl) {
    const label = DOMAIN_LABELS[domain] || domain;
    summaryEl.textContent = `${label} · 총 ${formatCount(activeTotal)}건 · 잔여 ${formatCount(activeRemaining)}건`;
  }
  if (cycleEl) {
    cycleEl.innerHTML = "";
    const cycleCount = Number(activeConfig?.client_cycle_count ?? 0);
    if (cycleCount > 0) {
      cycleEl.classList.add("active");
      const badge = document.createElement("span");
      badge.className = "cycle-badge";
      badge.textContent = cycleCount === 1 ? "1회 순환 완료" : `${cycleCount}회 순환 완료`;
      cycleEl.appendChild(badge);
      const completedAt = activeConfig?.client_last_cycle_at;
      if (completedAt) {
        const meta = document.createElement("span");
        meta.className = "cycle-meta";
        meta.textContent = formatDate(completedAt);
        cycleEl.appendChild(meta);
      }
    } else {
      cycleEl.classList.remove("active");
    }
  }
  card.querySelectorAll('[data-role="domainCount"]').forEach((span) => {
    const spanDomain = span.dataset.domain;
    const domainConfig = bestConfig(device, spanDomain);
    const remaining = Number(domainConfig?.client_remaining ?? 0);
    span.textContent = formatCount(remaining);
    span.title = `잔여 ${formatCount(remaining)}건`;
    if (remaining === 0 && Number(domainConfig?.client_total ?? 0) > 0) {
      span.classList.add("complete");
    } else {
      span.classList.remove("complete");
    }
    const label = span.closest("label[data-domain]");
    if (!label) {
      return;
    }
    if (spanDomain === domain) {
      label.classList.add("checked");
    } else {
      label.classList.remove("checked");
    }
  });
}

async function fetchJSON(url, options = {}) {
  const response = await fetch(url, {
    headers: { "Content-Type": "application/json" },
    credentials: "same-origin",
    ...options,
  });
  const contentType = response.headers.get("Content-Type") || "";
  const isJSON = contentType.includes("application/json");
  if (!response.ok) {
    const message = isJSON ? await response.json() : await response.text();
    const detail = message?.detail || message?.error || message;
    throw new Error(detail || "요청에 실패했습니다.");
  }
  return isJSON ? response.json() : response.text();
}

function ensureSuccessTracker(deviceId) {
  if (!deviceId) {
    return null;
  }
  if (!state.successCounters[deviceId]) {
    state.successCounters[deviceId] = {
      lastBatchId: null,
      resetCutoff: null,
      value: 0,
      anchor: 0,
    };
  }
  return state.successCounters[deviceId];
}

function parseTimestampMs(value) {
  if (!value) {
    return NaN;
  }
  const ms = Date.parse(value);
  return Number.isNaN(ms) ? NaN : ms;
}

function jobIsActive(job) {
  if (!job) {
    return false;
  }
  if (job.status === "running" && job.cancel_requested) {
    return true;
  }
  return ACTIVE_JOB_STATES.has(job.status);
}

function formatElapsedDuration(ms) {
  if (!Number.isFinite(ms) || ms < 0) {
    return "-";
  }
  const totalSeconds = Math.floor(ms / 1000);
  if (totalSeconds <= 0) {
    return "<1초";
  }
  const hours = Math.floor(totalSeconds / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;
  if (hours > 0) {
    return minutes > 0 ? `${hours}시간 ${minutes}분` : `${hours}시간`;
  }
  if (minutes > 0) {
    return seconds > 0 ? `${minutes}분 ${seconds}초` : `${minutes}분`;
  }
  return `${seconds}초`;
}

function describeElapsedStatus(job) {
  if (!job) {
    return { text: "대기 중", state: "idle" };
  }
  const active = jobIsActive(job);
  const cancelRequested = Boolean(job.cancel_requested);
  const startedMs = parseTimestampMs(job.started_at);
  const queuedMs = parseTimestampMs(job.queued_at);
  const createdMs = parseTimestampMs(job.created_at);
  const hasStarted = !Number.isNaN(startedMs);
  if (!hasStarted && (!active || job.status === "pending" || job.status === "dispatched")) {
    const label = JOB_STATUS_LABELS[job.status] || job.status || "대기 중";
    return { text: label, state: job.status || "idle" };
  }
  let startMs = startedMs;
  if (Number.isNaN(startMs)) {
    startMs = Number.isNaN(queuedMs) ? createdMs : queuedMs;
  }
  if (Number.isNaN(startMs)) {
    const fallbackLabel = JOB_STATUS_LABELS[job.status] || job.status || "대기 중";
    const state = active ? (cancelRequested ? "cancelling" : "running") : (job.status || "idle");
    return { text: fallbackLabel, state };
  }
  let endMs = Date.now();
  if (!active) {
    const finishedMs = parseTimestampMs(job.finished_at);
    if (!Number.isNaN(finishedMs)) {
      endMs = finishedMs;
    }
  }
  const diffMs = Math.max(0, endMs - startMs);
  const durationText = diffMs < 1000 ? "<1초" : formatElapsedDuration(diffMs);
  let statusLabel;
  let stateLabel;
  if (active) {
    statusLabel = cancelRequested ? "중지 중" : (JOB_STATUS_LABELS[job.status] || "진행 중");
    stateLabel = cancelRequested ? "cancelling" : "running";
  } else {
    const fallback = JOB_STATUS_LABELS[job.status] || job.status || "완료";
    statusLabel = fallback;
    if (job.status === "success") {
      stateLabel = "success";
    } else if (job.status === "failed") {
      stateLabel = "failed";
    } else if (job.status === "cancelled") {
      stateLabel = "cancelled";
    } else {
      stateLabel = job.status || "idle";
    }
  }
  return {
    text: `${statusLabel} ${durationText}`,
    state: stateLabel,
  };
}

function updateSuccessCounter(card, device) {
  if (!card || !device) {
    return;
  }
  const tracker = ensureSuccessTracker(device.id);
  if (!tracker) {
    return;
  }
  const job = latestBatchJob(device);
  const jobId = job?.id || null;
  if (jobId && tracker.lastBatchId !== jobId) {
    tracker.lastBatchId = jobId;
    tracker.value = 0;
    const jobCreatedMs = parseTimestampMs(job?.created_at);
    tracker.resetCutoff = Number.isNaN(jobCreatedMs) ? Date.now() : jobCreatedMs;
  } else if (!jobId && tracker.lastBatchId === null && tracker.resetCutoff === undefined) {
    tracker.resetCutoff = null;
  }

  if (jobId && tracker.resetCutoff === null) {
    const jobCreatedMs = parseTimestampMs(job?.created_at);
    tracker.resetCutoff = Number.isNaN(jobCreatedMs) ? Date.now() : jobCreatedMs;
  }

  const summary = latestJobSummary(job);
  if (summary) {
    const sentTotal = parseSummaryNumber(summary.sent);
    const anchorTotal = parseSummaryNumber(summary.anchor);
    tracker.value = sentTotal;
    tracker.anchor = anchorTotal;
    const counterEl = card.querySelector('[data-role="successCounter"]');
    if (counterEl) {
      counterEl.textContent = `누적 성공: ${formatCount(sentTotal)}건`;
    }
    const elapsedEl = card.querySelector('[data-role="elapsedCounter"]');
    if (elapsedEl) {
      const elapsed = describeElapsedStatus(job);
      elapsedEl.textContent = `경과: ${elapsed.text} · 알박기: ${formatCount(anchorTotal)}건`;
      if (elapsed.state) {
        elapsedEl.dataset.state = elapsed.state;
      } else {
        delete elapsedEl.dataset.state;
      }
    }
    return;
  }

  const cutoffMs = typeof tracker.resetCutoff === "number" && !Number.isNaN(tracker.resetCutoff)
    ? tracker.resetCutoff
    : null;

  let maxCount = 0;
  let anchorTotal = 0;
  (device.logs || []).forEach((entry) => {
    if (!entry?.success) {
      return;
    }
    if (cutoffMs !== null) {
      const entryMs = parseTimestampMs(entry.created_at);
      if (!Number.isNaN(entryMs) && entryMs < cutoffMs) {
        return;
      }
    }
    const parsed = parseSendLogPayload(entry.response);
    if (!parsed || typeof parsed.count !== "number") {
      return;
    }
    let candidate = parsed.count;
    if (parsed.isPrimary && typeof parsed.bccCount === "number" && parsed.bccCount > 0) {
      candidate = parsed.count + parsed.bccCount;
    }
    if (parsed.isPrimary && typeof parsed.anchorCount === "number" && parsed.anchorCount > 0) {
      anchorTotal += parsed.anchorCount;
    }
    if (candidate > maxCount) {
      maxCount = candidate;
    }
  });

  tracker.value = maxCount;
  tracker.anchor = anchorTotal;
  const counterEl = card.querySelector('[data-role="successCounter"]');
  if (counterEl) {
    counterEl.textContent = `누적 성공: ${formatCount(maxCount)}건`;
  }
  const elapsedEl = card.querySelector('[data-role="elapsedCounter"]');
  if (elapsedEl) {
    const elapsed = describeElapsedStatus(job);
    elapsedEl.textContent = `경과: ${elapsed.text} · 알박기: ${formatCount(anchorTotal)}건`;
    if (elapsed.state) {
      elapsedEl.dataset.state = elapsed.state;
    } else {
      delete elapsedEl.dataset.state;
    }
  }
}

function attachCardEvents(card) {
  const getDevice = () => {
    if (card.__deviceData) {
      return card.__deviceData;
    }
    const name = card.querySelector('[data-role="deviceName"]')?.textContent || card.dataset.deviceId;
    return { id: card.dataset.deviceId, active_domain: "naver", name, configs: {} };
  };

  const changeIpBtn = card.querySelector('button[data-action="change-ip"]');
  if (changeIpBtn) {
    changeIpBtn.addEventListener("click", async () => {
      const currentDevice = getDevice();
      if (!currentDevice?.id) {
        return;
      }
      const originalText = changeIpBtn.textContent;
      changeIpBtn.disabled = true;
      changeIpBtn.textContent = "IP 변경 중...";
      try {
        await fetchJSON(`/api/devices/${currentDevice.id}/actions/change-ip`, { method: "POST" });
        setNotice(card, "IP 변경 작업을 요청했습니다.");
        await loadDevices({ silent: true });
      } catch (err) {
        changeIpBtn.disabled = false;
        changeIpBtn.textContent = originalText || "IP 변경";
        setNotice(card, err.message || "IP 변경 요청에 실패했습니다.", "error");
      }
    });
  }

  const deleteBtn = card.querySelector('button[data-action="delete-device"]');
  if (deleteBtn) {
    deleteBtn.addEventListener("click", async () => {
      const currentDevice = getDevice();
      if (!currentDevice?.id) {
        return;
      }
      if (!state.deviceEditMode) {
        setDeviceEditMode(true);
        return;
      }
      const confirmed = confirm(`'${currentDevice.name}' 디바이스를 삭제하시겠습니까? 관련 설정과 로그도 함께 제거됩니다.`);
      if (!confirmed) {
        return;
      }
      state.deletingDevices.add(currentDevice.id);
      updateCardDeleteButton(card, currentDevice);
      try {
        await fetchJSON(`/api/devices/${currentDevice.id}`, { method: "DELETE" });
        setGlobalStatus(`'${currentDevice.name}' 디바이스를 삭제했습니다.`, "success");
        await loadDevices({ silent: true });
      } catch (err) {
        setGlobalStatus(err.message || "디바이스 삭제에 실패했습니다.", "error");
      } finally {
        state.deletingDevices.delete(currentDevice.id);
        updateCardDeleteButton(card, currentDevice);
      }
    });
  }

  card.querySelectorAll('[data-role="domainRadio"]').forEach((radio) => {
    radio.addEventListener("change", async (evt) => {
      if (!evt.target.checked) return;
      const currentDevice = getDevice();
      const domain = evt.target.value;
      try {
        await fetchJSON(`/api/devices/${currentDevice.id}/active-domain`, {
          method: "POST",
          body: JSON.stringify({ domain }),
        });
        currentDevice.active_domain = domain;
        card.__deviceData = { ...currentDevice };
        populateConfigForm(card, currentDevice, domain);
        updateSingleSendControls(card, card.__deviceData);
        setNotice(card, `${DOMAIN_LABELS[domain]} 도메인으로 전환했습니다.`);
      } catch (err) {
        setNotice(card, err.message || "도메인 전환에 실패했습니다.", "error");
      }
    });
  });

  CONFIG_FIELDS.forEach((fieldName) => {
    const el = card.querySelector(`[data-field="${fieldName}"]`);
    if (!el) {
      return;
    }
    el.addEventListener("input", (event) => {
      const currentDevice = getDevice();
      const domain = getActiveDomain(card, currentDevice.active_domain);
      markFieldDirty(currentDevice.id, domain, fieldName, event.target.value);
    });
  });

  const sessionInput = card.querySelector('[data-field="session_count"]');
  if (sessionInput) {
    sessionInput.addEventListener("blur", () => {
      const sanitized = sanitizeSessionValue(sessionInput.value);
      if (sessionInput.value !== sanitized) {
        sessionInput.value = sanitized;
      }
      const currentDevice = getDevice();
      const domain = getActiveDomain(card, currentDevice.active_domain);
      markFieldDirty(currentDevice.id, domain, "session_count", sanitized);
    });
  }

  const bccInput = card.querySelector('[data-field="bcc_count"]');
  if (bccInput) {
    bccInput.addEventListener("blur", () => {
      const sanitized = sanitizeBccValue(bccInput.value);
      if (bccInput.value !== sanitized) {
        bccInput.value = sanitized;
      }
      const currentDevice = getDevice();
      const domain = getActiveDomain(card, currentDevice.active_domain);
      markFieldDirty(currentDevice.id, domain, "bcc_count", sanitized);
    });
  }

  const anchorIntervalInput = card.querySelector('[data-field="anchor_interval"]');
  if (anchorIntervalInput) {
    anchorIntervalInput.addEventListener("blur", () => {
      const sanitized = sanitizeAnchorValue(anchorIntervalInput.value);
      if (anchorIntervalInput.value !== sanitized) {
        anchorIntervalInput.value = sanitized;
      }
      const currentDevice = getDevice();
      const domain = getActiveDomain(card, currentDevice.active_domain);
      markFieldDirty(currentDevice.id, domain, "anchor_interval", sanitized);
    });
  }

  const saveBtn = card.querySelector('button[data-action="save"]');
  saveBtn.addEventListener("click", async () => {
    const currentDevice = getDevice();
    const domain = card.querySelector(`input[name="domain-${currentDevice.id}"]:checked`)?.value || currentDevice.active_domain || "naver";
    try {
      await saveConfig(card, currentDevice, domain);
      setNotice(card, "설정을 저장했습니다.");
    } catch (err) {
      setNotice(card, err.message || "설정 저장에 실패했습니다.", "error");
    }
  });

  const copyGlobalBtn = card.querySelector('button[data-action="copy-global"]');
  if (copyGlobalBtn) {
    copyGlobalBtn.addEventListener("click", () => {
      const currentDevice = getDevice();
      const domain = card.querySelector(`input[name="domain-${currentDevice.id}"]:checked`)?.value || currentDevice.active_domain || "naver";
      const { payload } = collectConfigPayload(card, currentDevice, domain);
      applyValuesToGlobalDraft({
        helo: payload.helo,
        mail_from: payload.mail_from,
        header: payload.header,
        session_count: payload.session_count,
        bcc_count: payload.bcc_count,
      });
      setGlobalStatus("선택한 카드의 설정을 전체 설정 폼에 채웠습니다. 적용 버튼을 눌러 반영하세요.", "info");
    });
  }

  const singleBtn = card.querySelector('button[data-action="single"]');
  singleBtn.addEventListener("click", async () => {
    if (singleBtn.disabled) return;
    if (!singleBtn.dataset.defaultLabel) {
      singleBtn.dataset.defaultLabel = singleBtn.textContent;
    }

    const resetButton = () => {
      singleBtn.disabled = false;
      singleBtn.classList.remove("is-loading", "is-running");
      singleBtn.textContent = singleBtn.dataset.defaultLabel || "단일 발송";
      card.dataset.currentSingleJobId = "";
      if (card.dataset.activeDomain) {
        card.dataset.currentSingleJobDomain = normalizeDeviceDomain(card.dataset.activeDomain);
      }
    };

    singleBtn.disabled = true;
    singleBtn.classList.add("is-loading", "is-running");
    singleBtn.textContent = "단일 발송 중...";

    const currentDevice = getDevice();
    const domain = card.querySelector(`input[name="domain-${currentDevice.id}"]:checked`)?.value || currentDevice.active_domain || "naver";
    const rcpt = card.querySelector('[data-field="rcpt_to"]').value.trim();
    let jobScheduled = false;

    try {
      try {
        await ensureConfigSynced(card, currentDevice, domain);
      } catch (err) {
        setNotice(card, err.message || "설정 저장에 실패했습니다.", "error");
        resetButton();
        return;
      }

      const payload = { domain, rcpt_to: rcpt || null };
      try {
        const result = await fetchJSON(`/api/devices/${currentDevice.id}/actions/send-single`, {
          method: "POST",
          body: JSON.stringify(payload),
        });
        jobScheduled = true;
        const scheduledJob = result?.job;
        if (scheduledJob) {
          const baseDevice = card.__deviceData || currentDevice || {};
          const jobs = Array.isArray(baseDevice.jobs) ? [...baseDevice.jobs] : [];
          const existingIdx = jobs.findIndex((job) => job?.id === scheduledJob.id);
          const normalizedJob = {
            ...scheduledJob,
            job_type: scheduledJob.job_type || "single_send",
            status: scheduledJob.status || "pending",
            progress: Array.isArray(scheduledJob.progress) ? scheduledJob.progress : [],
            cancel_requested: Boolean(scheduledJob.cancel_requested),
          };
          if (existingIdx >= 0) {
            jobs[existingIdx] = { ...jobs[existingIdx], ...normalizedJob };
          } else {
            jobs.unshift(normalizedJob);
          }
          const updatedDevice = { ...baseDevice, jobs };
          card.__deviceData = updatedDevice;
          updateSingleSendControls(card, updatedDevice);
        } else {
          updateSingleSendControls(card, card.__deviceData || currentDevice);
        }
        setNotice(card, "단일 발송 작업을 추가했습니다.");
        try {
          await loadDevices();
        } catch (refreshErr) {
          console.error(refreshErr);
        }
      } catch (err) {
        setNotice(card, err.message || "단일 발송 예약에 실패했습니다.", "error");
        resetButton();
        return;
      }
    } finally {
      if (!singleBtn.isConnected) {
        return;
      }
      singleBtn.classList.remove("is-loading");
      if (jobScheduled) {
        updateSingleSendControls(card, card.__deviceData || currentDevice);
      }
    }
  });

  const batchBtn = card.querySelector('button[data-action="batch"]');
  batchBtn.addEventListener("click", async () => {
    const currentDevice = getDevice();
    const domain = card.querySelector(`input[name="domain-${currentDevice.id}"]:checked`)?.value || currentDevice.active_domain || "naver";
    try {
      await ensureConfigSynced(card, currentDevice, domain);
    } catch (err) {
      setNotice(card, err.message || "설정 저장에 실패했습니다.", "error");
      return;
    }
    try {
      await fetchJSON(`/api/devices/${currentDevice.id}/actions/send-batch`, {
        method: "POST",
        body: JSON.stringify({ domain }),
      });
      setNotice(card, "전체 발송 작업을 추가했습니다.");
      await loadDevices();
    } catch (err) {
      setNotice(card, err.message || "전체 발송 예약에 실패했습니다.", "error");
    }
  });

  const fileButtons = card.querySelectorAll('button[data-action="files"]');
  fileButtons.forEach((btn) => {
    btn.addEventListener("click", () => {
      const currentDevice = getDevice();
      const domain = btn.dataset.domain;
      openFileModal(currentDevice, domain);
    });
  });

  const clearBtn = card.querySelector('button[data-action="clear-logs"]');
  if (clearBtn) {
    clearBtn.addEventListener("click", async () => {
      const currentDevice = getDevice();
      if (!currentDevice?.id) return;
      clearBtn.disabled = true;
      const activeDomain = getActiveDomain(card, currentDevice.active_domain);
      try {
        await fetchJSON(`/api/devices/${currentDevice.id}/logs/clear`, {
          method: "POST",
          body: JSON.stringify({ domain: activeDomain }),
        });
        const listEl = card.querySelector('[data-role="logList"]');
        if (listEl) {
          listEl.innerHTML = '<div class="meta">발송 로그가 없습니다.</div>';
        }
        if (card.__deviceData) {
          card.__deviceData.logs = [];
        }
        setNotice(card, "로그를 삭제했습니다.");
        await loadDevices();
      } catch (err) {
        clearBtn.disabled = false;
        setNotice(card, err.message || "로그 삭제에 실패했습니다.", "error");
      }
    });
  }

  const cancelBtn = card.querySelector('button[data-action="cancel-batch"]');
  if (cancelBtn) {
    cancelBtn.addEventListener("click", async () => {
      const currentDevice = getDevice();
      const jobId = card.dataset.currentBatchJobId;
      if (!currentDevice?.id || !jobId) {
        return;
      }
      cancelBtn.disabled = true;
      const originalText = cancelBtn.textContent;
      cancelBtn.textContent = "중지 요청 중...";
      try {
        await fetchJSON(`/api/jobs/${jobId}/cancel`, {
          method: "POST",
          body: JSON.stringify({ device_id: currentDevice.id }),
        });
        setNotice(card, "중지 요청을 전송했습니다.");
        await loadDevices({ silent: true });
      } catch (err) {
        cancelBtn.disabled = false;
        cancelBtn.textContent = originalText || "중지";
        setNotice(card, err.message || "중지 요청에 실패했습니다.", "error");
      }
    });
  }

}
